    function renderFinance() {
      const month = document.getElementById('financeMonth')?.value || monthValue();
      const monthEntries = state.finance.filter(item => (item.date || '').startsWith(month));
      const income = monthEntries.filter(item => item.type === 'Entrada').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const expense = monthEntries.filter(item => item.type === 'Saida').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const cardFees = monthEntries.reduce((sum, item) => sum + Number(item.card_fee || 0), 0);
      const stockCosts = monthEntries.filter(item => item.type === 'Saida' && (item.category || '').toLowerCase().includes('estoque')).reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const operatingExpenses = Math.max(0, expense - stockCosts);
      const query = document.getElementById('financeSearch')?.value || '';
      const status = document.getElementById('financeStatus')?.value || '';
      const type = document.getElementById('financeType')?.value || '';
      const method = document.getElementById('financeMethod')?.value || '';
      const start = document.getElementById('financeStart')?.value || '';
      const end = document.getElementById('financeEnd')?.value || '';
      const list = state.finance.filter(item => textMatch(item, query) && (!type || item.type === type) && (!status || item.status === status) && (!method || item.payment_method === method) && (!start || item.date >= start) && (!end || item.date <= end));
      const rows = paginate('finance', list);
      const receivable = state.finance.filter(item => item.type === 'Entrada' && item.status === 'Pendente').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const payable = state.finance.filter(item => item.type === 'Saida' && item.status === 'Pendente').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const todayValue = new Date().toISOString().slice(0,10);
      const todayEntries = state.finance.filter(item => item.date === todayValue);
      const todayIncome = todayEntries.filter(item => item.type === 'Entrada' && item.status !== 'Pendente').reduce((sum, item) => sum + financeNet(item), 0);
      const todayExpense = todayEntries.filter(item => item.type === 'Saida' && item.status !== 'Pendente').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const todayCash = state.cash_sessions.find(item => item.date === todayValue) || {};
      const expectedCash = Number(todayCash.opening_amount || 0) + todayIncome - todayExpense;
      const methods = ['Dinheiro','PIX','Cartao','Boleto','Transferencia'];
      const methodRows = methods.map(pay => {
        const entries = monthEntries.filter(item => item.payment_method === pay);
        return {
          pay,
          gross: entries.filter(item => item.type === 'Entrada').reduce((sum, item) => sum + Number(item.amount || 0), 0),
          paid: entries.filter(item => item.type === 'Saida').reduce((sum, item) => sum + Number(item.amount || 0), 0),
          fee: entries.reduce((sum, item) => sum + Number(item.card_fee || 0), 0),
          reconciled: entries.filter(item => Number(item.reconciled || 0)).length,
          total: entries.length
        };
      });
      document.getElementById('content').innerHTML = `<div class="grid">
        <div class="filters"><input id="financeMonth" type="month" value="${month}" onchange="renderFinance()"><span></span><span></span></div>
        <div class="grid kpis">
          <div class="kpi"><span>Entradas</span><strong>${money(income)}</strong><small>Receitas registradas</small></div>
          <div class="kpi"><span>Saidas</span><strong>${money(expense)}</strong><small>Custos e despesas</small></div>
          <div class="kpi"><span>Resultado</span><strong>${money(income - expense - cardFees)}</strong><small>Saldo com taxas</small></div>
          <div class="kpi"><span>A pagar / receber</span><strong>${money(payable)} / ${money(receivable)}</strong><small>Contas em aberto</small></div>
        </div>
        <div class="dash-grid">
          <div class="panel"><div class="panel-head"><h2>Caixa diario</h2>${can('financeiro','pagar') ? `<button class="btn primary" onclick="cashSessionForm('${todayCash.id || ''}')">${todayCash.status === 'Aberto' ? 'Fechar caixa' : 'Abrir caixa'}</button>` : ''}</div><div class="panel-body summary-list">
            <div class="summary-item"><strong>Status</strong><span>${badge(todayCash.status || 'Nao aberto')}</span></div>
            <div class="summary-item"><strong>Abertura</strong><span>${money(todayCash.opening_amount || 0)}</span></div>
            <div class="summary-item"><strong>Movimento do dia</strong><span>${money(todayIncome - todayExpense)}</span></div>
            <div class="summary-item"><strong>Previsto no caixa</strong><span>${money(expectedCash)}</span></div>
            ${todayCash.status === 'Fechado' ? `<div class="summary-item"><strong>Diferenca</strong><span>${money(todayCash.difference || 0)}</span></div>` : ''}
          </div></div>
          <div class="panel"><div class="panel-head"><h2>Conciliacao por pagamento</h2></div><div class="panel-body summary-list">
            ${methodRows.map(row => `<div class="summary-item"><strong>${row.pay}</strong><span>${money(row.gross - row.paid - row.fee)} | ${row.reconciled}/${row.total} conc.</span></div>`).join('')}
          </div></div>
          <div class="panel"><div class="panel-head"><h2>DRE mensal</h2></div><div class="panel-body summary-list">
            <div class="summary-item"><strong>Receita bruta</strong><span>${money(income)}</span></div>
            <div class="summary-item"><strong>Taxas de cartao</strong><span>${money(cardFees)}</span></div>
            <div class="summary-item"><strong>Custo de estoque</strong><span>${money(stockCosts)}</span></div>
            <div class="summary-item"><strong>Despesas operacionais</strong><span>${money(operatingExpenses)}</span></div>
            <div class="summary-item"><strong>Lucro operacional</strong><span>${money(income - stockCosts - operatingExpenses - cardFees)}</span></div>
          </div></div>
        </div>
        <div class="panel"><div class="panel-head"><h2>Lancamentos financeiros</h2>${can('financeiro','criar') ? '<button class="btn primary" onclick="financeForm()">+ Lancamento</button>' : ''}</div><div class="panel-body">
          <div class="filters">
            <input id="financeSearch" placeholder="Buscar descricao, categoria, forma ou OS" value="${query}" oninput="resetPage('finance'); renderFinance()">
            <select id="financeType" onchange="resetPage('finance'); renderFinance()"><option value="">Todos tipos</option>${['Entrada','Saida'].map(item => `<option ${type === item ? 'selected' : ''}>${item}</option>`).join('')}</select>
            <select id="financeStatus" onchange="resetPage('finance'); renderFinance()"><option value="">Todos status</option>${['Recebido','Pago','Pendente'].map(item => `<option ${status === item ? 'selected' : ''}>${item}</option>`).join('')}</select>
          </div>
          <div class="filters">
            <select id="financeMethod" onchange="resetPage('finance'); renderFinance()"><option value="">Todas formas</option>${['Dinheiro','PIX','Cartao','Boleto','Transferencia'].map(item => `<option ${method === item ? 'selected' : ''}>${item}</option>`).join('')}</select>
            <input id="financeStart" type="date" value="${start}" onchange="resetPage('finance'); renderFinance()">
            <input id="financeEnd" type="date" value="${end}" onchange="resetPage('finance'); renderFinance()">
          </div>
          <table><thead><tr><th>Data</th><th>Tipo</th><th>Descricao</th><th>Status</th><th>Pagamento</th><th>Valor</th><th>Taxa</th><th>Liquido</th><th>Conc.</th><th>Acoes</th></tr></thead><tbody>
            ${rows.map(item => `<tr><td>${item.date}<br><span class="muted">Venc. ${item.due_date || ''}</span></td><td>${badge(item.type)}</td><td><strong>${item.description}</strong><br><span class="muted">${item.category || ''}${item.installments > 1 ? ` | Parcela ${item.installment}/${item.installments}` : ''}</span></td><td>${badge(item.status)}</td><td>${item.payment_method || ''}</td><td><span class="money">${money(item.amount)}</span></td><td>${money(item.card_fee || 0)}</td><td>${money(financeNet(item))}</td><td>${Number(item.reconciled || 0) ? badge('Pago') : badge('Pendente')}</td><td><div class="actions">${can('financeiro','editar') ? `<button class="icon-btn" onclick="financeForm('${item.id}')" title="Editar">E</button>` : ''} ${can('financeiro','excluir') ? `<button class="icon-btn" onclick="removeRecord('finance','${item.id}','finance')" title="Excluir">X</button>` : ''}</div></td></tr>`).join('') || '<tr><td colspan="10">Nenhum lancamento.</td></tr>'}
          </tbody></table>${pager('finance', list.length, 'renderFinance')}
        </div></div>
      </div>`;
      restoreFocus();
    }

    function financeForm(id = '') {
      const item = state.finance.find(row => row.id === id) || {};
      formPanel(id ? 'Editar lancamento' : 'Novo lancamento', `
        <label>Tipo<select name="type">${['Entrada','Saida'].map(value => `<option ${item.type === value ? 'selected' : ''}>${value}</option>`).join('')}</select></label>
        <label>Status<select name="status">${['Recebido','Pago','Pendente'].map(value => `<option ${item.status === value ? 'selected' : ''}>${value}</option>`).join('')}</select></label>
        <label>Data<input name="date" type="date" value="${item.date || new Date().toISOString().slice(0,10)}"></label>
        <label>Vencimento<input name="due_date" type="date" value="${item.due_date || item.date || new Date().toISOString().slice(0,10)}"></label>
        <label>Categoria<input name="category" value="${item.category || ''}"></label>
        <label>Forma pagamento<select name="payment_method"><option value="">Selecione</option>${['Dinheiro','PIX','Cartao','Boleto','Transferencia'].map(value => `<option ${item.payment_method === value ? 'selected' : ''}>${value}</option>`).join('')}</select></label>
        <label>Valor<input name="amount" type="number" step="0.01" value="${item.amount || 0}"></label>
        <label>Taxa cartao<input name="card_fee" type="number" step="0.01" value="${item.card_fee || 0}"></label>
        <label>Vincular OS<select name="order_id"><option value="">Sem OS</option>${state.orders.map(order => `<option value="${order.id}" ${item.order_id === order.id ? 'selected' : ''}>OS #${order.number} - ${order.client_name}</option>`).join('')}</select></label>
        <label>Caixa diario<select name="cash_session_id"><option value="">Sem caixa</option>${state.cash_sessions.map(session => `<option value="${session.id}" ${item.cash_session_id === session.id ? 'selected' : ''}>${session.date} - ${session.status}</option>`).join('')}</select></label>
        <label>Recorrencia<select name="recurrence_frequency"><option value="">Nao recorrente</option>${['Mensal','Semanal','Anual'].map(value => `<option ${item.recurrence_frequency === value ? 'selected' : ''}>${value}</option>`).join('')}</select></label>
        <label>Parcelas<input name="installments" type="number" min="1" value="${item.installments || 1}"></label>
        <label>Recorrente ate<input name="recurrence_until" type="date" value="${item.recurrence_until || ''}"></label>
        <label class="check-row"><input name="reconciled" type="checkbox" value="1" ${Number(item.reconciled || 0) ? 'checked' : ''}><span>Conciliado<br><small>Marque quando conferido no banco, cartao ou caixa.</small></span></label>
        <label class="wide">Descricao<textarea name="description">${item.description || ''}</textarea></label>
      `, form => {
        const data = Object.fromEntries(form.entries());
        data.reconciled = form.get('reconciled') ? 1 : 0;
        return saveRecord('finance', id, data);
      }, 'finance');
    }

    function cashSessionForm(id = '') {
      const todayValue = new Date().toISOString().slice(0,10);
      const item = state.cash_sessions.find(row => row.id === id) || state.cash_sessions.find(row => row.date === todayValue) || {};
      const dayEntries = state.finance.filter(row => row.date === (item.date || todayValue) && row.status !== 'Pendente');
      const received = dayEntries.filter(row => row.type === 'Entrada').reduce((sum, row) => sum + financeNet(row), 0);
      const paid = dayEntries.filter(row => row.type === 'Saida').reduce((sum, row) => sum + Number(row.amount || 0), 0);
      const expected = Number(item.opening_amount || 0) + received - paid;
      formPanel(item.id ? 'Fechamento do caixa diario' : 'Abertura do caixa diario', `
        <label>Data<input name="date" type="date" value="${item.date || todayValue}"></label>
        <label>Status<select name="status">${['Aberto','Fechado'].map(value => `<option ${item.status === value ? 'selected' : ''}>${value}</option>`).join('')}</select></label>
        <label>Valor de abertura<input name="opening_amount" type="number" step="0.01" value="${item.opening_amount || 0}"></label>
        <label>Valor contado no fechamento<input name="closing_amount" type="number" step="0.01" value="${item.closing_amount || expected}"></label>
        <label>Valor previsto<input name="expected_amount" type="number" step="0.01" value="${item.expected_amount || expected}"></label>
        <label>Movimento calculado<input disabled value="${money(received - paid)}"></label>
        <label class="wide">Observacoes<textarea name="notes">${item.notes || ''}</textarea></label>
      `, form => saveRecord('cash-sessions', item.id || '', Object.fromEntries(form.entries())), 'finance');
    }

    function reportDateFilter(rows, field = 'date') {
      const start = document.getElementById('reportStart')?.value || '';
      const end = document.getElementById('reportEnd')?.value || '';
      return rows.filter(row => (!start || (row[field] || row.opened || '') >= start) && (!end || (row[field] || row.opened || '') <= end));
    }

    function sumBy(rows, keyFn, seedFn, addFn) {
      const map = new Map();
      rows.forEach(row => {
        const key = keyFn(row) || 'Nao informado';
        if (!map.has(key)) map.set(key, seedFn(key));
        addFn(map.get(key), row);
      });
      return Array.from(map.values());
    }

    function reportLabel(type) {
      return {
        clients: 'Clientes',
        orders: 'Ordens de Servico',
        parts: 'Estoque baixo',
        turnover: 'Giro de estoque',
        finance: 'Financeiro',
        dre: 'DRE mensal',
        technician_profit: 'Lucro por tecnico',
        warranty_returns: 'Garantia e retorno',
        top_services: 'Servicos mais vendidos',
        top_parts: 'Pecas mais usadas',
        manufacturers: 'Fabricantes',
        services: 'Servicos'
      }[type] || type;
    }

    function reportRows(type) {
      if (type === 'orders') return reportDateFilter(state.orders, 'opened').map(order => ({
        OS: order.number, Cliente: order.client_name, Fabricante: order.device_brand, Modelo: order.device_model, IMEI: order.device_imei,
        Status: order.status, Aprovacao: order.approval_status, Prioridade: order.priority, Abertura: order.opened, Prazo: order.due,
        Tecnico: order.technician_name, Defeito: order.defect, Diagnostico: order.diagnosis, Solucao: order.solution,
        Total: order.calc?.total || 0, Pago: order.calc?.paid || 0, Saldo: order.calc?.balance || 0
      }));
      if (type === 'finance') return reportDateFilter(state.finance, 'date').map(item => ({
        Data: item.date, Vencimento: item.due_date, Tipo: item.type, Categoria: item.category, Descricao: item.description,
        Valor: item.amount, Taxa_cartao: item.card_fee || 0, Liquido: financeNet(item), Status: item.status, Pagamento: item.payment_method,
        Conciliado: Number(item.reconciled || 0) ? 'Sim' : 'Nao', Recorrencia: item.recurrence_frequency || '', Parcela: item.installments > 1 ? `${item.installment}/${item.installments}` : '', OS: item.order_id || ''
      }));
      if (type === 'dre') {
        const financeRows = reportDateFilter(state.finance, 'date');
        const income = financeRows.filter(row => row.type === 'Entrada').reduce((sum, row) => sum + Number(row.amount || 0), 0);
        const expense = financeRows.filter(row => row.type === 'Saida').reduce((sum, row) => sum + Number(row.amount || 0), 0);
        const fees = financeRows.reduce((sum, row) => sum + Number(row.card_fee || 0), 0);
        const stockCosts = financeRows.filter(row => row.type === 'Saida' && (row.category || '').toLowerCase().includes('estoque')).reduce((sum, row) => sum + Number(row.amount || 0), 0);
        const operating = Math.max(0, expense - stockCosts);
        return [
          { Linha: 'Receita bruta', Valor: income },
          { Linha: 'Taxas de cartao', Valor: -fees },
          { Linha: 'Custo de estoque', Valor: -stockCosts },
          { Linha: 'Despesas operacionais', Valor: -operating },
          { Linha: 'Lucro operacional', Valor: income - fees - stockCosts - operating }
        ];
      }
      if (type === 'technician_profit') return sumBy(reportDateFilter(state.orders, 'opened'), order => order.technician_name || 'Sem tecnico', name => ({
        Tecnico: name, OS: 0, Receita: 0, Custo_pecas: 0, Mao_de_obra: 0, Lucro: 0, Margem: '0%'
      }), (acc, order) => {
        const partCost = (order.parts || []).reduce((sum, part) => sum + Number(part.unit_cost || 0) * Number(part.quantity || 1), 0);
        const labor = (order.services || []).reduce((sum, service) => sum + Number(service.labor || 0), 0);
        const total = Number(order.calc?.total || 0);
        acc.OS += 1;
        acc.Receita += total;
        acc.Custo_pecas += partCost;
        acc.Mao_de_obra += labor;
        acc.Lucro += total - partCost;
        acc.Margem = acc.Receita ? `${((acc.Lucro / acc.Receita) * 100).toFixed(1)}%` : '0%';
      }).sort((a,b) => b.Lucro - a.Lucro);
      if (type === 'warranty_returns') return reportDateFilter(state.orders, 'opened').filter(order => {
        const text = `${order.follow_up || ''} ${order.warranty_term || ''} ${order.status || ''}`.toLowerCase();
        return text.includes('retorno') || text.includes('garantia') || text.includes('pos-venda') || text.includes('pós-venda') || (order.parts || []).some(part => Number(part.warranty_days || 0) > 0) || (order.services || []).some(service => Number(service.warranty_days || 0) > 0);
      }).map(order => {
        const maxWarranty = Math.max(0, ...(order.parts || []).map(part => Number(part.warranty_days || 0)), ...(order.services || []).map(service => Number(service.warranty_days || 0)));
        return {
          OS: order.number, Cliente: order.client_name, Aparelho: `${order.device_brand || ''} ${order.device_model || ''}`.trim(),
          Status: order.status, Abertura: order.opened, Entrega: order.delivery_signed_at || '', Garantia_dias: maxWarranty || 90,
          Tecnico: order.technician_name || '', Pos_venda: order.follow_up || '', Total: order.calc?.total || 0
        };
      });
      if (type === 'top_services') return sumBy(reportDateFilter(state.orders, 'opened').flatMap(order => (order.services || []).map(service => ({ order, service }))), item => item.service.name, name => ({
        Servico: name, Quantidade: 0, Receita: 0, Garantia_media: 0
      }), (acc, item) => {
        acc.Quantidade += 1;
        acc.Receita += Number(item.service.labor || 0);
        acc.Garantia_media = Math.round(((acc.Garantia_media * (acc.Quantidade - 1)) + Number(item.service.warranty_days || 0)) / acc.Quantidade);
      }).sort((a,b) => b.Quantidade - a.Quantidade || b.Receita - a.Receita);
      if (type === 'top_parts') return sumBy(reportDateFilter(state.orders, 'opened').flatMap(order => (order.parts || []).map(part => ({ order, part }))), item => item.part.name, name => ({
        Peca: name, SKU: '', Quantidade: 0, Receita: 0, Custo: 0, Lucro: 0
      }), (acc, item) => {
        const qty = Number(item.part.quantity || 1);
        acc.SKU = item.part.sku || acc.SKU;
        acc.Quantidade += qty;
        acc.Receita += Number(item.part.unit_price || 0) * qty;
        acc.Custo += Number(item.part.unit_cost || 0) * qty;
        acc.Lucro = acc.Receita - acc.Custo;
      }).sort((a,b) => b.Quantidade - a.Quantidade || b.Lucro - a.Lucro);
      if (type === 'parts') return state.parts.filter(part => Number(part.stock || 0) <= Number(part.min_stock || 0)).map(part => ({
        SKU: part.sku, Peca: part.name, Categoria: part.category, Fabricante: manufacturerName(part.manufacturer_id),
        Uso: part.usage_type || 'Ambos', Estoque: part.stock, Minimo: part.min_stock, Custo_medio: part.cost, Preco: part.price, Sugestao_compra: reorderQty(part)
      }));
      if (type === 'turnover') return state.parts.map(part => {
        const saidas = (state.stock_movements || []).filter(mov => mov.part_id === part.id && mov.type === 'Saida').reduce((sum, mov) => sum + Number(mov.quantity || 0), 0);
        const entradas = (state.stock_movements || []).filter(mov => mov.part_id === part.id && mov.type === 'Entrada').reduce((sum, mov) => sum + Number(mov.quantity || 0), 0);
        return {
          SKU: part.sku, Item: part.name, Uso: part.usage_type || 'Ambos', Estoque_atual: part.stock, Entradas: entradas, Saidas: saidas,
          Giro: saidas > 0 ? 'Com giro' : 'Parado', Sugestao_compra: reorderQty(part), Custo_medio: part.cost, Preco: part.price
        };
      });
      if (type === 'services') return state.services.map(service => ({
        Servico: service.name, Categoria: service.category, Mao_de_obra: service.labor, Garantia_dias: service.warranty_days, Prazo: service.duration
      }));
      if (type === 'clients') return state.clients.map(client => ({
        Nome: client.name, Telefone: client.phone, Email: client.email, Documento: client.document, CEP: client.zip,
        Logradouro: client.street, Numero: client.number, Bairro: client.neighborhood, Cidade: client.city, UF: client.state, Complemento: client.complement, Observacoes: client.notes
      }));
      if (type === 'manufacturers') return state.models.map(model => ({
        Fabricante: manufacturerName(model.manufacturer_id), Modelo: model.name, Categoria: model.category, Ano: model.year, Observacoes: model.notes
      }));
      return [];
    }

    function renderReports() {
      const start = document.getElementById('reportStart')?.value || '';
      const end = document.getElementById('reportEnd')?.value || '';
      const orderRows = reportRows('orders');
      const financeRows = reportRows('finance');
      const lowPartsRows = reportRows('parts');
      const turnoverRows = reportRows('turnover');
      const technicianRows = reportRows('technician_profit');
      const warrantyRows = reportRows('warranty_returns');
      const topServiceRows = reportRows('top_services');
      const topPartRows = reportRows('top_parts');
      const income = financeRows.filter(row => row.Tipo === 'Entrada').reduce((sum, row) => sum + Number(row.Valor || 0), 0);
      const expense = financeRows.filter(row => row.Tipo === 'Saida').reduce((sum, row) => sum + Number(row.Valor || 0), 0);
      const statusCounts = orderRows.reduce((acc, row) => (acc[row.Status] = (acc[row.Status] || 0) + 1, acc), {});
      const reportTypes = ['clients','orders','finance','dre','technician_profit','warranty_returns','top_services','top_parts','parts','turnover','manufacturers','services'];
      document.getElementById('content').innerHTML = `<div class="grid">
        <div class="panel"><div class="panel-head"><h2>Relatorios e exportacao</h2><span class="muted">${start || end ? `Periodo: ${start || 'inicio'} ate ${end || 'hoje'}` : 'Sem filtro de data'}</span></div><div class="panel-body">
          <div class="report-period">
            <label>Data inicial<input id="reportStart" type="date" value="${start}" onchange="renderReports()"></label>
            <label>Data final<input id="reportEnd" type="date" value="${end}" onchange="renderReports()"></label>
            <label>&nbsp;<button class="btn primary" onclick="renderReports()">Aplicar periodo</button></label>
            <label>&nbsp;<button class="btn" onclick="document.getElementById('reportStart').value='';document.getElementById('reportEnd').value='';renderReports()">Limpar filtro</button></label>
          </div>
          <div class="export-grid">
            ${reportTypes.map(type => `<div class="summary-item"><strong>${reportLabel(type)}</strong><span class="actions"><button class="icon-btn" onclick="exportReport('${type}','excel')" title="Baixar Excel">XLS</button><button class="icon-btn" onclick="exportReport('${type}','pdf')" title="Exportar PDF">PDF</button></span></div>`).join('')}
          </div>
          <div style="height:14px"></div>
          <div class="grid kpis">
            <div class="kpi"><span>Fluxo de caixa</span><strong>${money(income - expense)}</strong><small>Entradas menos saidas</small></div>
            <div class="kpi"><span>Resultado mensal</span><strong>${money(income - expense)}</strong><small>DRE simples do periodo</small></div>
            <div class="kpi"><span>Lucro por tecnico</span><strong>${money(technicianRows.reduce((sum, row) => sum + Number(row.Lucro || 0), 0))}</strong><small>${technicianRows.length} tecnico(s)</small></div>
            <div class="kpi"><span>Garantias/retornos</span><strong>${warrantyRows.length}</strong><small>OS com garantia ou pos-venda</small></div>
          </div>
        </div></div>
        <div class="dash-grid">
          <div class="panel"><div class="panel-head"><h2>Status das OS</h2></div><div class="panel-body">${Object.entries(statusCounts).map(([name, count]) => `<div class="summary-item"><strong>${name}</strong><span>${count}</span></div>`).join('') || '<div class="empty">Sem OS no periodo.</div>'}</div></div>
          <div class="panel"><div class="panel-head"><h2>Resultado financeiro</h2></div><div class="panel-body">
            <div class="summary-item"><strong>Entradas</strong><span>${money(income)}</span></div>
            <div class="summary-item"><strong>Saidas</strong><span>${money(expense)}</span></div>
            <div class="summary-item"><strong>Resultado</strong><span>${money(income - expense)}</span></div>
          </div></div>
          <div class="panel"><div class="panel-head"><h2>Giro de estoque</h2></div><div class="panel-body">
            ${turnoverRows.sort((a,b) => Number(b.Saidas || 0) - Number(a.Saidas || 0)).slice(0, 8).map(row => `<div class="summary-item"><strong>${row.Item}</strong><span>${row.Saidas} saidas | estoque ${row.Estoque_atual} | comprar ${row.Sugestao_compra}</span></div>`).join('') || '<div class="empty">Sem movimentacao de estoque.</div>'}
          </div></div>
          <div class="panel"><div class="panel-head"><h2>Lucro por tecnico</h2></div><div class="panel-body">
            ${technicianRows.slice(0, 6).map(row => `<div class="summary-item"><strong>${row.Tecnico}</strong><span>${money(row.Lucro)} | ${row.OS} OS | margem ${row.Margem}</span></div>`).join('') || '<div class="empty">Sem tecnico no periodo.</div>'}
          </div></div>
          <div class="panel"><div class="panel-head"><h2>Servicos mais vendidos</h2></div><div class="panel-body">
            ${topServiceRows.slice(0, 6).map(row => `<div class="summary-item"><strong>${row.Servico}</strong><span>${row.Quantidade} venda(s) | ${money(row.Receita)}</span></div>`).join('') || '<div class="empty">Sem servicos no periodo.</div>'}
          </div></div>
          <div class="panel"><div class="panel-head"><h2>Pecas mais usadas</h2></div><div class="panel-body">
            ${topPartRows.slice(0, 6).map(row => `<div class="summary-item"><strong>${row.Peca}</strong><span>${row.Quantidade} un. | lucro ${money(row.Lucro)}</span></div>`).join('') || '<div class="empty">Sem pecas no periodo.</div>'}
          </div></div>
          <div class="panel"><div class="panel-head"><h2>Garantia e retorno</h2></div><div class="panel-body">
            ${warrantyRows.slice(0, 6).map(row => `<div class="summary-item"><strong>OS #${row.OS} - ${row.Cliente}</strong><span>${row.Status} | garantia ${row.Garantia_dias} dias</span></div>`).join('') || '<div class="empty">Sem retorno/garantia no periodo.</div>'}
          </div></div>
        </div>
      </div>`;
    }

    function exportReport(type, format = 'excel') {
      const rows = reportRows(type);
      if (!rows.length) return alert('Nao ha dados para exportar.');
      if (format === 'pdf') return exportPdf(`relatorio-${type}`, rows, reportLabel(type));
      exportExcel(`relatorio-${type}`, rows);
    }

    function exportExcel(name, rows) {
      const columns = Object.keys(rows[0] || {});
      const html = `<table><thead><tr>${columns.map(column => `<th>${column}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${columns.map(column => `<td>${String(row[column] ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      const blob = new Blob([`\ufeff${html}`], { type: 'application/vnd.ms-excel;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${name}-${new Date().toISOString().slice(0,10)}.xls`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function exportPdf(name, rows, title) {
      const columns = Object.keys(rows[0] || {});
      const company = state.company || {};
      const start = document.getElementById('reportStart')?.value || '';
      const end = document.getElementById('reportEnd')?.value || '';
      const period = start || end ? `${start || 'inicio'} ate ${end || 'hoje'}` : 'Sem filtro de data';
      const table = `<table><thead><tr>${columns.map(column => `<th>${escapeHtml(column)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${columns.map(column => `<td>${escapeHtml(row[column])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      const html = `<!doctype html><html><head><meta charset="utf-8"><title>${escapeHtml(title)}</title><style>
        @page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111827;margin:0;font-size:11px}header{display:flex;align-items:center;gap:12px;border-bottom:3px solid ${company.primary_color || '#f9732f'};padding-bottom:10px;margin-bottom:12px}img{width:52px;height:52px;object-fit:contain}h1{font-size:20px;margin:0}p{margin:3px 0;color:#667085}.meta{margin-left:auto;text-align:right}table{width:100%;border-collapse:collapse}th{background:#f4f6f8;color:#667085;text-align:left;font-size:10px;text-transform:uppercase}th,td{border-bottom:1px solid #d9e0e8;padding:6px;vertical-align:top}tbody tr:nth-child(even){background:#fafafa}.footer{margin-top:14px;color:#667085;font-size:10px}
      </style></head><body>
        <header><img src="${company.logo_path || '/troca-ae-logo.jpg'}"><div><h1>${escapeHtml(title)}</h1><p>${escapeHtml(company.trade_name || company.system_name || 'Troca Ae SIS PRO')}</p><p>${escapeHtml(company.phone || '')} ${escapeHtml(company.email || '')}</p></div><div class="meta"><strong>${escapeHtml(period)}</strong><p>Gerado em ${new Date().toLocaleString('pt-BR')}</p><p>${rows.length} registro(s)</p></div></header>
        ${table}
        <div class="footer">${escapeHtml(company.print_footer || '')}</div>
        <script>window.onload=()=>{setTimeout(()=>window.print(),250)}<\/script>
      </body></html>`;
      const win = window.open('', '_blank');
      if (!win) return alert('Permita pop-ups para gerar o PDF.');
      win.document.write(html);
      win.document.close();
    }

    function renderSettings() {
      const c = state.company || {};
      if (!selectedUserId || !state.users.some(user => user.id === selectedUserId)) selectedUserId = state.users[0]?.id || '';
      const selectedUser = state.users.find(user => user.id === selectedUserId);
      document.getElementById('content').innerHTML = `<div class="panel" style="margin-bottom:14px"><div class="panel-head"><h2>Dados da empresa e marca</h2>${can('configuracoes','editar') ? '<button class="btn primary" onclick="saveCompanySettings()">Salvar alteracoes</button>' : ''}</div><div class="panel-body">
        <form class="form-grid" id="companyForm">
          <label>Nome do sistema<input name="system_name" value="${c.system_name || ''}"></label>
          <label>Nome fantasia<input name="trade_name" value="${c.trade_name || ''}"></label>
          <label>Razao social<input name="legal_name" value="${c.legal_name || ''}"></label>
          <label>CNPJ/Documento<input name="document" value="${c.document || ''}"></label>
          <label>Telefone<input name="phone" value="${c.phone || ''}"></label>
          <label>E-mail<input name="email" value="${c.email || ''}"></label>
          <label>CEP<input name="zip" value="${c.zip || ''}"></label>
          <label>Logradouro<input name="street" value="${c.street || ''}"></label>
          <label>Numero<input name="number" value="${c.number || ''}"></label>
          <label>Bairro<input name="neighborhood" value="${c.neighborhood || ''}"></label>
          <label>Cidade<input name="city" value="${c.city || ''}"></label>
          <label>UF<input name="state" value="${c.state || ''}"></label>
          <label>Cor principal<input name="primary_color" type="color" value="${c.primary_color || '#f9732f'}"></label>
          <label>Cor lateral<input name="dark_color" type="color" value="${c.dark_color || '#18231f'}"></label>
          <label>Tema<select name="theme"><option value="light" ${c.theme !== 'dark' ? 'selected' : ''}>Claro</option><option value="dark" ${c.theme === 'dark' ? 'selected' : ''}>Escuro</option></select></label>
          <label class="wide">Logo do sistema
            <input id="companyLogoPath" name="logo_path" value="${c.logo_path || '/troca-ae-logo.jpg'}">
            <div class="actions">
              <button class="btn" type="button" onclick="document.getElementById('companyLogoFile').click()">Upload da logo</button>
              <button class="btn" type="button" onclick="document.getElementById('companyLogoPath').value='/troca-ae-logo.jpg';document.getElementById('companyLogoPreview').src='/troca-ae-logo.jpg'">Usar logo Troca Ae</button>
            </div>
            <input id="companyLogoFile" type="file" accept="image/*" class="hidden" onchange="readLogoFile(this)">
            <img id="companyLogoPreview" src="${c.logo_path || '/troca-ae-logo.jpg'}" alt="Logo" style="width:86px;height:86px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:white;padding:6px">
          </label>
          <label class="wide">Rodape da OS<textarea name="print_footer">${c.print_footer || ''}</textarea></label>
          <label class="wide">Termo de garantia padrao<textarea name="warranty_term" style="min-height:190px">${c.warranty_term || ''}</textarea></label>
        </form>
      </div></div>
      <div class="grid two">
        <div class="panel"><div class="panel-head"><h2>Usuarios</h2>${can('configuracoes','editar') ? '<button class="btn primary" onclick="userForm()">+ Usuario</button>' : ''}</div><div class="panel-body">
          <table><thead><tr><th>Usuario</th><th>Perfil</th><th>Status</th><th>Seguranca</th><th>Acoes</th></tr></thead><tbody>
            ${state.users.map(u => `<tr class="${u.id === selectedUserId ? 'selected-row' : ''}" onclick="selectUserForPermissions('${u.id}')"><td><strong>${u.name}</strong><br><span class="muted">${u.email}</span></td><td>${u.role_name}</td><td>${badge(u.status)}</td><td>${userSecurityInfo(u)}</td><td><div class="actions">${can('configuracoes','editar') ? `${u.locked_until ? `<button class="btn" onclick="event.stopPropagation();unlockUser('${u.id}')">Desbloquear</button>` : ''} <button class="btn" onclick="event.stopPropagation();selectUserForPermissions('${u.id}')">Ver permissoes</button> <button class="icon-btn" onclick="event.stopPropagation();userForm('${u.id}')" title="Editar">E</button> <button class="icon-btn" onclick="event.stopPropagation();removeRecord('users','${u.id}','settings')" title="Excluir">X</button>` : ''}</div></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nenhum usuario cadastrado.</td></tr>'}
          </tbody></table>
        </div></div>
        <div class="panel"><div class="panel-head"><h2>Escala de permissoes</h2>${can('configuracoes','editar') ? '<button class="btn primary" onclick="roleForm()">+ Perfil</button>' : ''}</div><div class="panel-body">
          ${selectedUser ? permissionMatrixForUser(selectedUser) : '<div class="empty">Selecione um usuario para ver permissoes.</div>'}
        </div></div>
        <div class="panel" style="grid-column:1/-1"><div class="panel-head"><h2>Backup e seguranca</h2>${can('configuracoes','editar') ? '<button class="btn primary" onclick="createBackup()">Criar backup agora</button>' : ''}</div><div class="panel-body">
          <div class="grid two">
            <div class="summary-item"><strong>Banco de dados</strong><span>${(state.database?.engine || 'sqlite').toUpperCase()} ${state.database?.production ? 'producao' : 'local'}</span></div>
            <div class="summary-item"><strong>Backup automatico diario</strong><span>Ativo ao iniciar o sistema</span></div>
          </div>
          <div id="backupList" class="muted">Carregando backups...</div>
        </div></div>
      </div>`;
      loadBackups();
    }

    function selectUserForPermissions(id) {
      selectedUserId = id;
      renderSettings();
    }

    function userSecurityInfo(user) {
      const locked = user.locked_until ? `<br><strong>Bloqueio:</strong> ${user.locked_until}` : '';
      const changed = user.password_changed_at ? `<br><strong>Senha:</strong> ${user.password_changed_at}` : '';
      return `<small><strong>Ultimo login:</strong> ${user.last_login || 'Nunca'}<br><strong>Tentativas:</strong> ${user.failed_attempts || 0}${locked}${changed}</small>`;
    }

    async function unlockUser(id) {
      await api(`/api/users/${id}/unlock`, { method:'POST', body: JSON.stringify({}) });
      state = await api('/api/bootstrap');
      renderSettings();
    }

    function permissionMatrixForUser(user) {
      const role = state.roles.find(item => item.id === user.role_id);
      if (!role) return '<div class="empty">Perfil nao encontrado.</div>';
      const permissions = safeJson(role.permissions, {});
      return `<div style="margin-bottom:12px"><strong>${user.name}</strong><br><span class="muted">${user.email} - ${role.name} - nivel ${role.level}</span></div>${permissionMatrix(permissions, false)}`;
    }

    async function saveCompanySettings() {
      const data = Object.fromEntries(new FormData(document.getElementById('companyForm')).entries());
      state.company = await api('/api/company', { method:'POST', body: JSON.stringify(data) });
      applyBranding();
      alert('Configuracoes salvas.');
      renderSettings();
    }

    function fileSize(bytes) {
      const value = Number(bytes || 0);
      if (value > 1024 * 1024) return `${(value / 1024 / 1024).toFixed(1)} MB`;
      if (value > 1024) return `${(value / 1024).toFixed(1)} KB`;
      return `${value} bytes`;
    }

    async function loadBackups() {
      const target = document.getElementById('backupList');
      if (!target) return;
      try {
        const backups = await api('/api/backups');
        target.innerHTML = `<table><thead><tr><th>Arquivo</th><th>Data</th><th>Tamanho</th><th>Acoes</th></tr></thead><tbody>
          ${backups.map(item => `<tr><td><strong>${item.name}</strong></td><td>${item.created_at}</td><td>${fileSize(item.size)}</td><td><div class="actions"><button class="btn" onclick="downloadBackup('${item.name}')">Baixar</button>${can('configuracoes','editar') ? `<button class="btn" onclick="restoreBackup('${item.name}')">Restaurar</button>` : ''}</div></td></tr>`).join('') || '<tr><td colspan="4" class="muted">Nenhum backup encontrado.</td></tr>'}
        </tbody></table>`;
      } catch (error) {
        target.textContent = error.message;
      }
    }

    async function createBackup() {
      await api('/api/backups', { method:'POST', body: JSON.stringify({}) });
      alert('Backup criado com sucesso.');
      loadBackups();
    }

    async function downloadBackup(name) {
      const response = await fetch(`/api/backups/download?name=${encodeURIComponent(name)}`, {
        headers: token ? { Authorization: `Bearer ${token}` } : {}
      });
      if (!response.ok) return alert('Nao foi possivel baixar o backup.');
      const blob = await response.blob();
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = name;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    async function restoreBackup(name) {
      const localMode = (state.database?.engine || 'sqlite') === 'sqlite';
      const message = localMode
        ? `Preparar a restauracao do backup ${name}? O sistema vai criar um backup de seguranca e aplicar a restauracao quando for reiniciado.`
        : `Restaurar o backup ${name}? O sistema vai criar um backup de seguranca antes da restauracao, mas os dados atuais serao substituidos.`;
      if (!confirm(message)) return;
      const result = await api('/api/backups/restore', { method:'POST', body: JSON.stringify({ name }) });
      if (result.restart_required) {
        alert('Restauracao preparada. Feche e abra o sistema novamente para aplicar o backup.');
      } else {
        alert('Backup restaurado com sucesso. O sistema sera recarregado.');
        location.reload();
      }
    }

    function clientName(id) {
      return state.clients.find(c => c.id === id)?.name || '';
    }

    function manufacturerName(id) {
      return state.manufacturers.find(m => m.id === id)?.name || '';
    }

    function partName(id) {
      return state.parts.find(part => part.id === id)?.name || '';
    }

    if (token) boot().catch(() => logout());
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
