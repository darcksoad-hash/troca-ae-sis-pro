<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Troca Ae SIS PRO - App</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f9732f">
  <style>
    :root { --orange:#f9732f; --green:#f9732f; --green-2:#fff1e8; --blue:#1d5f8f; --blue-2:#e3eff8; --amber:#9a6b12; --amber-2:#fff2ce; --red:#aa3a35; --red-2:#fae7e5; --bg:#f7f8fb; --surface:#ffffff; --ink:#20242a; --muted:#667085; --line:#e4e7ec; --card:#fff; --surface-2:#f2f4f7; --shadow:0 14px 34px rgba(16,24,40,.08); --radius:8px; --sidebar-width:72px; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: Inter, Segoe UI, Arial, sans-serif; font-size:16px; letter-spacing:0; background:radial-gradient(circle at top left, rgba(249,115,47,.10), transparent 34%), linear-gradient(180deg,#fbfcff 0%,var(--bg) 38%); color:var(--ink); }
    body.sidebar-fixed { --sidebar-width:268px; }
    body.sidebar-fixed .app { grid-template-columns:268px minmax(0,1fr); }
    .login { min-height:100vh; display:grid; place-items:center; padding:20px; }
    .box, .panel, header { background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
    .box { width:min(420px,100%); padding:24px; display:grid; gap:14px; }
    .brand { display:flex; align-items:center; gap:11px; min-width:236px; padding:0 8px 18px; border-bottom:1px solid var(--line); margin-bottom:8px; }
    .brand img { width:48px; height:48px; object-fit:contain; background:white; border:1px solid #ffe0cf; border-radius:10px; padding:3px; }
    .brand-text { min-width:135px; transition:opacity .18s ease; }
    .brand-text strong { display:block; font-size:16px; }
    .brand-text span { color:var(--muted); font-size:12px; }
    input, textarea, select, button { font:inherit; }
    input, textarea, select { width:100%; border:1px solid var(--line); border-radius:8px; min-height:40px; padding:10px; }
    textarea { min-height:90px; resize:vertical; }
    label { display:grid; gap:6px; font-size:13px; color:var(--muted); font-weight:700; text-transform:uppercase; }
    button, .btn { border:1px solid var(--line); background:white; color:var(--ink); border-radius:9px; padding:9px 12px; cursor:pointer; display:inline-flex; gap:8px; align-items:center; min-height:38px; white-space:nowrap; }
    .primary, .btn.primary, button.primary { background:var(--orange); border-color:var(--orange); color:white; box-shadow:0 8px 18px rgba(249,115,47,.22); }
    .btn.warn { border-color:var(--amber); color:var(--amber); }
    .btn.danger { border-color:var(--red); color:var(--red); }
    .app { display:grid; grid-template-columns:var(--sidebar-width) minmax(0,1fr); min-height:100vh; transition:grid-template-columns .22s ease; }
    aside { background:rgba(255,255,255,.92); border-right:1px solid var(--line); padding:22px 10px; position:sticky; top:0; height:100vh; width:72px; overflow:hidden; box-shadow:8px 0 30px rgba(16,24,40,.05); backdrop-filter:blur(12px); z-index:20; transition:width .22s ease, padding .22s ease, box-shadow .22s ease; display:grid; align-content:start; gap:10px; }
    body.sidebar-fixed aside, aside:hover { width:268px; padding-left:16px; padding-right:16px; box-shadow:18px 0 42px rgba(16,24,40,.13); }
    body:not(.sidebar-fixed) aside:not(:hover) .brand-text, body:not(.sidebar-fixed) aside:not(:hover) .nav-label { opacity:0; pointer-events:none; }
    .sidebar-pin { width:34px; height:34px; display:grid; place-items:center; color:var(--orange); padding:0; }
    nav { display:grid; gap:5px; }
    aside button[data-page] { width:236px; min-width:236px; border:0; background:transparent; color:#475467; display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:8px; text-align:left; box-shadow:none; }
    aside button[data-page]:hover { background:#fff4ed; color:var(--orange); }
    aside button.active { background:var(--orange); color:white; box-shadow:0 10px 20px rgba(249,115,47,.22); }
    .nav-ico { width:22px; text-align:center; flex:0 0 22px; }
    .nav-label { transition:opacity .18s ease; }
    main { padding:24px 28px; min-width:0; width:100%; }
    header { padding:16px 18px; display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:20px; background:rgba(255,255,255,.82); backdrop-filter:blur(10px); }
    h1, h2 { margin:0; }
    h1 { font-size:30px; line-height:1.15; }
    h2 { font-size:19px; }
    .sub { color:var(--muted); margin-top:5px; font-size:15px; }
    .toolbar { display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    .grid { display:grid; gap:14px; }
    .kpis { grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:18px; }
    .panel { overflow:hidden; }
    .panel-head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .panel-body { padding:14px 16px; overflow:auto; }
    .kpi { padding:17px; border-top:3px solid var(--orange); min-height:110px; }
    .kpi span { color:var(--muted); font-size:14px; }
    .kpi strong { display:block; font-size:32px; margin-top:12px; }
    .kpi small { display:block; color:var(--muted); margin-top:6px; }
    .dash-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,.65fr); gap:14px; align-items:stretch; }
    .mini-chart-row { display:grid; grid-template-columns:170px minmax(0,1fr) 78px; align-items:center; gap:10px; font-size:15px; }
    .mini-track { height:9px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
    .mini-fill { height:100%; border-radius:999px; background:var(--orange); }
    .summary-item { display:flex; justify-content:space-between; gap:10px; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fbfcfd; font-size:15px; margin-bottom:9px; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:11px 10px; border-bottom:1px solid var(--line); text-align:left; font-size:15px; vertical-align:top; }
    th { color:var(--muted); font-size:13px; text-transform:uppercase; background:#f9fafb; }
    .muted { color:var(--muted); }
    .hidden { display:none !important; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .wide { grid-column:1/-1; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .split, .ops-layout { display:grid; grid-template-columns:minmax(320px,.85fr) minmax(0,1.15fr); gap:14px; align-items:start; }
    .two { grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr); }
    .os-list { display:grid; gap:9px; max-height:calc(100vh - 285px); overflow:auto; padding-right:3px; }
    .os-card { width:100%; text-align:left; border:1px solid var(--line); background:white; display:grid; gap:8px; margin-bottom:8px; border-radius:10px; padding:12px; transition:border-color .16s ease, box-shadow .16s ease, transform .16s ease; }
    .os-card:hover, .os-card.active { border-color:var(--orange); box-shadow:0 10px 22px rgba(249,115,47,.14); transform:translateY(-1px); }
    .os-card-top, .detail-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .os-card strong { font-size:16px; }
    .os-meta { display:grid; gap:8px; color:var(--muted); font-size:14px; }
    .detail-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .status-strip { height:5px; border-radius:999px; background:var(--orange); }
    .detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .detail-item { border:1px solid var(--line); border-radius:10px; padding:10px; background:#fbfcfd; min-height:62px; }
    .detail-item span { display:block; color:var(--muted); font-size:13px; font-weight:700; text-transform:uppercase; margin-bottom:4px; }
    .photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; }
    .photo-grid a { border:1px solid var(--line); border-radius:8px; padding:6px; color:inherit; text-decoration:none; background:white; }
    .photo-grid img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:6px; background:#f2f4f7; }
    .filters { display:grid; grid-template-columns:minmax(220px,1fr) 180px 180px; gap:10px; margin-bottom:14px; }
    .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap; margin-top:12px; color:var(--muted); font-size:13px; }
    .pager select { width:auto; min-width:72px; }
    .pill, .badge { display:inline-flex; align-items:center; border-radius:999px; padding:4px 9px; font-size:12px; font-weight:700; white-space:nowrap; background:var(--green-2); color:var(--green); }
    .pill.green { background:var(--green-2); color:var(--green); }
    .pill.blue { background:var(--blue-2); color:var(--blue); }
    .pill.amber { background:var(--amber-2); color:var(--amber); }
    .pill.red { background:var(--red-2); color:var(--red); }
    .detail-top { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:12px; }
    .money { color:var(--orange); font-weight:800; }
    .empty { color:var(--muted); padding:18px; border:1px dashed var(--line); border-radius:8px; background:#fbfcfd; }
    .export-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .export-grid .icon-btn { width:auto; min-width:46px; padding:0 10px; font-size:12px; font-weight:800; }
    .report-period { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
    .permission-grid { overflow:auto; }
    .permission-grid table { min-width:760px; }
    .selected-row { background:rgba(249,115,47,.09); }
    .check-list { display:grid; gap:9px; margin-top:6px; }
    .check-row { display:grid; grid-template-columns:24px minmax(0,1fr); align-items:start; gap:10px; color:var(--ink); font-size:15px; font-weight:600; text-transform:none; }
    .check-row input { width:18px; min-height:18px; margin-top:2px; padding:0; }
    .check-row small { color:var(--muted); font-weight:500; }
    .model-list { max-height:360px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:10px; background:#fbfcfd; }
    body.dark-mode {
      --bg:#111418; --surface:#171b21; --surface-2:#20252d; --ink:#f4f6f8; --muted:#aab2bf; --line:#2c3440; --shadow:0 14px 34px rgba(0,0,0,.25);
      background:#111418;
    }
    body.dark-mode aside, body.dark-mode header, body.dark-mode .panel, body.dark-mode .kpi, body.dark-mode .os-card, body.dark-mode .detail-item { background:var(--surface); color:var(--ink); }
    body.dark-mode input, body.dark-mode select, body.dark-mode textarea, body.dark-mode button, body.dark-mode .btn, body.dark-mode .icon-btn { background:#101318; color:var(--ink); border-color:var(--line); }
    body.dark-mode th { background:var(--surface-2); }
    body.dark-mode .summary-item, body.dark-mode .empty { background:#101318; }
    @media (max-width:980px) { .app, body.sidebar-fixed .app{grid-template-columns:1fr} aside, body.sidebar-fixed aside{position:static;height:auto;width:100%;padding:14px;box-shadow:none} body:not(.sidebar-fixed) aside:not(:hover) .brand-text, body:not(.sidebar-fixed) aside:not(:hover) .nav-label{opacity:1;pointer-events:auto}.brand{min-width:0;padding-bottom:12px} nav{grid-template-columns:repeat(3,minmax(0,1fr))} aside button[data-page]{width:auto;min-width:0}.kpis{grid-template-columns:repeat(2,1fr)} .split,.dash-grid{grid-template-columns:1fr} header{align-items:flex-start;flex-direction:column}.toolbar{justify-content:flex-start} }
    @media (max-width:980px) { .filters{grid-template-columns:1fr} .two,.ops-layout,.split{grid-template-columns:1fr}.os-list{max-height:none}.export-grid{grid-template-columns:1fr 1fr}.report-period{grid-template-columns:1fr 1fr} }
    @media (max-width:560px) { main{padding:14px} nav{grid-template-columns:1fr 1fr} header{display:grid} .kpis,.form-grid,.detail-grid,.filters{grid-template-columns:1fr} .toolbar,.actions{width:100%;justify-content:flex-start} button{white-space:normal} }
  </style>
</head>
<body>
  <section class="login" id="login">
    <form class="box" id="loginForm">
      <div class="brand">
        <img src="/troca-ae-logo.jpg" alt="Troca Ae">
        <div><h1>Troca Ae SIS PRO</h1><div class="muted">Versao com banco de dados</div></div>
      </div>
      <label>E-mail<input name="email" value="admin@troca-ae.local"></label>
      <label>Senha<input name="password" type="password" value="admin123"></label>
      <button class="primary">Entrar</button>
      <div class="muted">Acesso inicial: admin@troca-ae.local / admin123</div>
    </form>
  </section>

  <section class="app hidden" id="app">
    <aside>
      <div class="brand">
        <img id="brandLogo" src="/troca-ae-logo.jpg" alt="">
        <div class="brand-text"><strong id="brandName">Troca Ae SIS PRO</strong><span id="brandSubtitle">Assistencia tecnica</span></div>
        <button class="sidebar-pin" id="sidebarPinBtn" type="button" title="Fixar menu">&#8660;</button>
      </div>
      <nav>
        <button class="active" data-page="dashboard"><span class="nav-ico">&#9638;</span><span class="nav-label">Painel</span></button>
        <button data-page="clients"><span class="nav-ico">&#9673;</span><span class="nav-label">Clientes</span></button>
        <button data-page="orders"><span class="nav-ico">&#9635;</span><span class="nav-label">Ordens de servico</span></button>
        <button data-page="catalog"><span class="nav-ico">&#9671;</span><span class="nav-label">Fabricantes</span></button>
        <button data-page="parts"><span class="nav-ico">&#9639;</span><span class="nav-label">Pecas</span></button>
        <button data-page="services"><span class="nav-ico">&#9672;</span><span class="nav-label">Servicos</span></button>
        <button data-page="pos"><span class="nav-ico">&#9702;</span><span class="nav-label">PDV</span></button>
        <button data-page="finance"><span class="nav-ico">&#9670;</span><span class="nav-label">Financeiro</span></button>
        <button data-page="reports"><span class="nav-ico">&#9636;</span><span class="nav-label">Relatorios</span></button>
        <button data-page="settings"><span class="nav-ico">&#9873;</span><span class="nav-label">Configuracoes</span></button>
      </nav>
    </aside>
    <main>
      <header>
        <div><h1 id="title">Painel</h1><div class="sub" id="subtitle">Dados salvos no banco do sistema.</div></div>
        <div class="toolbar"><button class="btn primary" onclick="can('os','criar') ? orderForm() : render('orders')">+ Nova OS</button><button class="btn" onclick="passwordForm()">Trocar senha</button><button class="btn" onclick="logout()">Sair</button></div>
      </header>
      <div id="content"></div>
    </main>
  </section>

  <script>
    let token = localStorage.getItem('troca-ae-token') || '';
    let state = { company:null, database:null, me:null, clients:[], manufacturers:[], models:[], parts:[], services:[], suppliers:[], stock_movements:[], purchases:[], purchase_items:[], pos_sales:[], pos_sale_items:[], orders:[], finance:[], cash_sessions:[] };
    let selectedOrderId = '';
    let selectedUserId = '';
    let focusMemory = null;
    let sidebarFixed = localStorage.getItem('troca-ae-sidebar-fixed') === '1';
    const pageSize = 20;
    const pageState = {};

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}), ...(options.headers || {}) }
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Falha na operacao.');
      return data;
    }

    document.addEventListener('input', event => {
      const target = event.target;
      if (target?.id) {
        focusMemory = {
          id: target.id,
          start: target.selectionStart,
          end: target.selectionEnd,
          value: target.value
        };
      }
    }, true);

    function restoreFocus() {
      const remembered = focusMemory;
      if (!remembered?.id) return;
      setTimeout(() => {
        const target = document.getElementById(remembered.id);
        if (!target) return;
        target.focus();
        if ('selectionStart' in target) {
          const pos = Math.min(remembered.start ?? target.value.length, target.value.length);
          target.setSelectionRange(pos, pos);
        }
      }, 0);
    }

    document.getElementById('loginForm').onsubmit = async event => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      try {
        const result = await api('/api/login', { method:'POST', body: JSON.stringify({ email: form.get('email'), password: form.get('password') }) });
        token = result.token;
        localStorage.setItem('troca-ae-token', token);
        await boot();
      } catch (error) {
        alert(error.message);
      }
    };

    document.querySelectorAll('aside button[data-page]').forEach(button => {
      button.onclick = () => {
        document.querySelectorAll('aside button').forEach(item => item.classList.toggle('active', item === button));
        render(button.dataset.page);
      };
    });

    document.getElementById('sidebarPinBtn').onclick = () => {
      sidebarFixed = !sidebarFixed;
      localStorage.setItem('troca-ae-sidebar-fixed', sidebarFixed ? '1' : '0');
      updateSidebarPin();
    };

    async function boot() {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      state = await api('/api/bootstrap-lite');
      applyBranding();
      updateSidebarPin();
      applyPermissions();
      const requestedPage = new URLSearchParams(location.search).get('page') || 'dashboard';
      await render(document.querySelector(`aside button[data-page="${requestedPage}"]:not(.hidden)`) ? requestedPage : 'dashboard');
    }

    function applyBranding() {
      const company = state.company || {};
      document.title = company.system_name || 'Troca Ae SIS PRO';
      document.documentElement.style.setProperty('--orange', company.primary_color || '#f9732f');
      document.documentElement.style.setProperty('--green', company.primary_color || '#f9732f');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', company.primary_color || '#f9732f');
      document.getElementById('brandName').textContent = company.system_name || 'Troca Ae SIS PRO';
      document.getElementById('brandLogo').src = company.logo_path || '/troca-ae-logo.jpg';
      document.body.classList.toggle('dark-mode', company.theme === 'dark');
    }

    function updateSidebarPin() {
      document.body.classList.toggle('sidebar-fixed', sidebarFixed);
      const btn = document.getElementById('sidebarPinBtn');
      btn.innerHTML = sidebarFixed ? '&#10003;' : '&#8660;';
      btn.title = sidebarFixed ? 'Menu fixo ativado' : 'Fixar menu';
    }

    function can(module, action) {
      const user = state.me || {};
      if (Number(user.level || 0) >= 100) return true;
      return (user.permissions?.[module] || []).includes(action);
    }

    function applyPermissions() {
      const visible = {
        dashboard: true,
        clients: can('clientes', 'ver'),
        orders: can('os', 'ver'),
        catalog: can('fabricantes', 'ver'),
        parts: can('estoque', 'ver'),
        services: can('servicos', 'ver'),
        pos: can('pdv', 'ver') || (can('financeiro','criar') && can('estoque','movimentar')),
        finance: can('financeiro', 'ver'),
        reports: can('relatorios', 'ver'),
        settings: true
      };
      document.querySelectorAll('aside button[data-page]').forEach(button => {
        button.classList.toggle('hidden', !visible[button.dataset.page]);
      });
    }

    async function logout() {
      if (token) {
        try { await api('/api/logout', { method:'POST', body: JSON.stringify({}) }); } catch {}
      }
      token = '';
      localStorage.removeItem('troca-ae-token');
      document.getElementById('app').classList.add('hidden');
      document.getElementById('login').classList.remove('hidden');
    }

    function money(value) {
      return Number(value || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
    }

    function financeNet(item) {
      const amount = Number(item.amount || 0);
      const fee = Number(item.card_fee || 0);
      return item.type === 'Entrada' ? amount - fee : amount;
    }

    function monthValue() {
      return new Date().toISOString().slice(0,7);
    }

    function textMatch(row, query) {
      return !query || Object.values(row || {}).join(' ').toLowerCase().includes(query.toLowerCase());
    }

    function getPage(key, total) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      pageState[key] = Math.min(Math.max(1, pageState[key] || 1), pages);
      return pageState[key];
    }

    function paginate(key, rows) {
      const page = getPage(key, rows.length);
      return rows.slice((page - 1) * pageSize, page * pageSize);
    }

    function resetPage(key) {
      pageState[key] = 1;
    }

    function changePage(key, direction, callback) {
      pageState[key] = (pageState[key] || 1) + Number(direction || 0);
      window[callback]?.();
    }

    function setPage(key, value, callback) {
      pageState[key] = Number(value) || 1;
      window[callback]?.();
    }

    function pager(key, total, callback) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      const page = getPage(key, total);
      if (total <= pageSize) return '';
      return `<div class="pager"><span>${total} registros</span><button ${page <= 1 ? 'disabled' : ''} onclick="changePage('${key}',-1,'${callback}')">Anterior</button><span>Pagina</span><select onchange="setPage('${key}',this.value,'${callback}')">${Array.from({length:pages}, (_, i) => `<option value="${i + 1}" ${page === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select><span>de ${pages}</span><button ${page >= pages ? 'disabled' : ''} onclick="changePage('${key}',1,'${callback}')">Proximo</button></div>`;
    }

    function badge(text) {
      const value = text || '';
      const tone = ['Finalizada','Recebido','Pago','Entrada','Aprovada','Ativo'].includes(value) ? 'green' : ['Pendente','Aguardando peca','Aguardando aprovacao'].includes(value) ? 'amber' : ['Cancelada','Saida','Reprovada','Inativo','Bloqueado'].includes(value) ? 'red' : 'blue';
      return `<span class="pill ${tone}">${value}</span>`;
    }

    function statusColor(status) {
      if (['Finalizada','Aprovada','Entregue','Pago','Recebido'].includes(status)) return '#16a36a';
      if (['Em execucao','Em execução','Entrada'].includes(status)) return '#1d5f8f';
      if (['Aguardando aprovacao','Aguardando aprovação','Aguardando diagnostico','Aguardando diagnóstico','Aguardando peca','Aguardando peça','Pendente','Aberta'].includes(status)) return '#d99116';
      if (['Cancelada','Reprovada','Saida','Saída'].includes(status)) return '#c7473f';
      return '#f9732f';
    }

    async function ensureFullData() {
      if (state.full) return;
      document.getElementById('content').innerHTML = '<div class="panel"><div class="panel-body muted">Carregando dados completos...</div></div>';
      state = await api('/api/bootstrap');
      applyBranding();
      applyPermissions();
    }

    async function render(page) {
      if (['clients','orders','catalog','parts','services','pos','finance','reports','settings','users'].includes(page)) {
        await ensureFullData();
      }
      const names = { dashboard:'Painel geral', clients:'Clientes', orders:'Ordens de servico', catalog:'Fabricantes e modelos', parts:'Pecas e estoque', services:'Servicos', pos:'PDV', finance:'Financeiro', reports:'Relatorios', settings:'Configuracoes' };
      document.getElementById('title').textContent = names[page] || 'Painel';
      if (page === 'dashboard') renderDashboard();
      if (page === 'clients') renderClients();
      if (page === 'orders') renderOrders();
      if (page === 'catalog') renderCatalog();
      if (page === 'parts') renderParts();
      if (page === 'services') renderServices();
      if (page === 'pos') renderPOS();
      if (page === 'finance') renderFinance();
      if (page === 'reports') renderReports();
      if (page === 'users') renderSettings();
      if (page === 'settings') renderSettings();
    }

    async function renderDashboard() {
      const dash = await api('/api/dashboard');
      const openOrders = dash.overdue_orders || state.orders.filter(order => !['Finalizada','Cancelada'].includes(order.status));
      const statuses = dash.order_statuses || state.orders.reduce((acc, order) => (acc[order.status] = (acc[order.status] || 0) + 1, acc), {});
      const maxStatus = Math.max(1, ...Object.values(statuses));
      const topStatuses = Object.entries(statuses).sort((a,b) => b[1] - a[1]);
      const income = Number(dash.income || 0) || state.finance.filter(item => item.type === 'Entrada').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const expense = Number(dash.expense || 0) || state.finance.filter(item => item.type === 'Saida').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const lowParts = dash.low_parts || state.parts.filter(part => Number(part.stock || 0) <= Number(part.min_stock || 0));
      const partsTotal = Number(dash.parts_total ?? state.parts.length);
      const stockSummary = [['Estoque baixo', Number(dash.parts_low_stock ?? lowParts.length)], ['Sem estoque', Number(dash.parts_no_stock ?? state.parts.filter(part => Number(part.stock || 0) === 0).length)], ['Total de pecas', partsTotal]];
      document.getElementById('content').innerHTML = `
        <div class="grid kpis">
          <div class="kpi"><span>OS abertas</span><strong>${dash.open_orders}</strong><small>Servicos em andamento</small></div>
          <div class="kpi"><span>A receber</span><strong>${money(dash.receivable)}</strong><small>Saldos de OS nao quitadas</small></div>
          <div class="kpi"><span>Saldo financeiro</span><strong>${money(income - expense)}</strong><small>Entradas menos saidas</small></div>
          <div class="kpi"><span>Estoque baixo</span><strong>${dash.parts_low_stock}</strong><small>Pecas abaixo do minimo</small></div>
        </div>
        <div class="dash-grid">
          <div class="panel">
            <div class="panel-head"><h2>Operacao por status</h2><button class="btn primary" onclick="render('orders')">Ver OS</button></div>
            <div class="panel-body chart-list">
              ${topStatuses.map(([name, count]) => `<div class="mini-chart-row"><strong>${name}</strong><div class="mini-track"><div class="mini-fill" style="width:${count / maxStatus * 100}%;background:${statusColor(name)}"></div></div><span>${count} OS</span></div>`).join('') || '<div class="muted">Nenhuma OS cadastrada.</div>'}
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>Resumo financeiro</h2><button class="btn" onclick="render('finance')">Ver financeiro</button></div>
            <div class="panel-body summary-list">
              <div class="summary-item"><strong>Entradas</strong><span class="money">${money(income)}</span></div>
              <div class="summary-item"><strong>Saidas</strong><span class="money">${money(expense)}</span></div>
              <div class="summary-item"><strong>Resultado</strong><span class="money">${money(income - expense)}</span></div>
            </div>
          </div>
        </div>
        <div class="grid two" style="margin-top:14px">
          <div class="panel">
            <div class="panel-head"><h2>Estoque em resumo</h2><button class="btn" onclick="render('parts')">Ver pecas</button></div>
            <div class="panel-body chart-list">
              ${stockSummary.map(([name, count]) => `<div class="mini-chart-row"><strong>${name}</strong><div class="mini-track"><div class="mini-fill" style="width:${Math.min(100, count / Math.max(1, partsTotal) * 100)}%"></div></div><span>${count}</span></div>`).join('')}
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>Alertas operacionais</h2></div>
            <div class="panel-body summary-list">
              ${openOrders.slice(0,3).map(order => `<div class="summary-item"><strong>OS ${order.number} atrasada</strong><span>${order.client_name}</span></div>`).join('') || '<div class="summary-item"><strong>Sem OS atrasada</strong><span>Hoje</span></div>'}
              ${lowParts.slice(0,3).map(part => `<div class="summary-item"><strong>${part.name}</strong><span>${part.stock}/${part.min_stock}</span></div>`).join('')}
            </div>
          </div>
        </div>`;
    }

    function renderClients() {
      const query = document.getElementById('clientSearch')?.value || '';
      const list = state.clients.filter(client => textMatch(client, query));
      const rows = paginate('clients', list);
      document.getElementById('content').innerHTML = `<div class="panel">
        <div class="panel-head"><h2>Cadastro de clientes</h2>${can('clientes','criar') ? '<button class="btn primary" onclick="clientForm()">+ Cliente</button>' : ''}</div>
        <div class="panel-body">
          <div class="filters"><input id="clientSearch" placeholder="Pesquisar em Cadastro de clientes" value="${query}" oninput="resetPage('clients'); renderClients()"><span></span><span></span></div>
          <table><thead><tr><th>Nome</th><th>Contato</th><th>Endereco</th><th>Observacoes</th><th>Acoes</th></tr></thead><tbody>
            ${rows.map(c => `<tr><td><strong>${c.name}</strong><br><span class="muted">${c.document || ''}</span></td><td>${c.phone || ''}<br><span class="muted">${c.email || ''}</span></td><td>${[c.street,c.number,c.neighborhood,c.city,c.state].filter(Boolean).join(' - ')}</td><td>${c.notes || ''}</td><td><div class="actions">${can('clientes','editar') ? `<button class="icon-btn" title="Editar" onclick="clientForm('${c.id}')">E</button>` : ''} ${can('clientes','excluir') ? `<button class="icon-btn" title="Excluir" onclick="removeRecord('clients','${c.id}','clients')">X</button>` : ''}</div></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nenhum cliente encontrado.</td></tr>'}
          </tbody></table>${pager('clients', list.length, 'renderClients')}
        </div>
      </div>`;
      restoreFocus();
    }

    function clientForm(id = '') {
      const item = state.clients.find(client => client.id === id) || {};
      document.getElementById('content').innerHTML = `<div class="panel"><div class="panel-head"><h2>Novo cliente</h2></div><div class="panel-body">
        <form class="form-grid" id="clientForm">
          <label>Nome<input name="name" required value="${item.name || ''}"></label><label>Telefone<input name="phone" value="${item.phone || ''}"></label>
          <label>E-mail<input name="email" value="${item.email || ''}"></label><label>Documento<input name="document" value="${item.document || ''}"></label>
          <label>CEP<input name="zip" value="${item.zip || ''}" onblur="lookupCep(this.form)"></label><label>Logradouro<input name="street" value="${item.street || ''}"></label>
          <label>Numero da residencia<input name="number" value="${item.number || ''}"></label><label>Bairro<input name="neighborhood" value="${item.neighborhood || ''}"></label>
          <label>Cidade<input name="city" value="${item.city || ''}"></label><label>UF<input name="state" value="${item.state || ''}"></label>
          <label>Complemento<input name="complement" value="${item.complement || ''}"></label><label class="wide">Observacoes<textarea name="notes">${item.notes || ''}</textarea></label>
          <div class="actions wide"><button class="primary">Salvar</button><button type="button" onclick="renderClients()">Cancelar</button></div>
        </form>
      </div></div>`;
      document.getElementById('clientForm').onsubmit = async event => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.currentTarget).entries());
        await api(`/api/clients${id ? `/${id}` : ''}`, { method:'POST', body: JSON.stringify(data) });
        state = await api('/api/bootstrap');
        renderClients();
      };
    }

    async function lookupCep(form) {
      const zip = (form.zip.value || '').replace(/\D/g, '');
      if (zip.length !== 8) return;
      try {
        const res = await fetch(`https://viacep.com.br/ws/${zip}/json/`);
        const data = await res.json();
        if (data.erro) return;
        form.street.value = data.logradouro || form.street.value;
        form.neighborhood.value = data.bairro || form.neighborhood.value;
        form.city.value = data.localidade || form.city.value;
        form.state.value = data.uf || form.state.value;
      } catch {}
    }

    function renderOrders() {
      const query = document.getElementById('orderSearch')?.value || '';
      const status = document.getElementById('orderStatus')?.value || '';
      const priority = document.getElementById('orderPriority')?.value || '';
      const list = state.orders.filter(order => {
        const hay = `${order.number} ${order.client_name} ${order.device_brand} ${order.device_model} ${order.device_imei} ${order.technician_name} ${order.defect}`;
        return textMatch({ hay }, query) && (!status || order.status === status) && (!priority || order.priority === priority);
      }).sort((a,b) => Number(b.number) - Number(a.number));
      const rows = paginate('orders', list);
      if (!selectedOrderId || !list.some(order => order.id === selectedOrderId)) selectedOrderId = list[0]?.id || state.orders[0]?.id || '';
      document.getElementById('content').innerHTML = `<div class="panel">
        <div class="panel-head"><h2>Painel operacional de OS</h2>${can('os','criar') ? '<button class="btn primary" onclick="orderForm()">+ Nova OS</button>' : ''}</div>
        <div class="panel-body">
          <div class="filters">
            <input id="orderSearch" placeholder="Buscar por cliente, aparelho, OS ou tecnico" value="${query}" oninput="resetPage('orders'); renderOrders()">
            <select id="orderStatus" onchange="resetPage('orders'); renderOrders()"><option value="">Todos os status</option>${osStatuses.map(item => `<option ${status === item ? 'selected' : ''}>${item}</option>`).join('')}</select>
            <select id="orderPriority" onchange="resetPage('orders'); renderOrders()"><option value="">Todas prioridades</option>${['Normal','Alta','Urgente'].map(item => `<option ${priority === item ? 'selected' : ''}>${item}</option>`).join('')}</select>
          </div>
          <div class="ops-layout">
        <div class="panel">
          <div class="panel-body">
            <div class="os-list">
            ${rows.map(order => `<button class="os-card ${order.id === selectedOrderId ? 'active' : ''}" onclick="selectOrder('${order.id}')">
              <div class="status-strip" style="background:${statusColor(order.status)}"></div>
              <div class="os-card-top"><strong>#${order.number} - ${order.client_name}</strong>${badge(order.status)}</div>
              <div class="os-meta"><span>${order.device_brand || ''} ${order.device_model || ''}</span><span>${order.defect || 'Sem defeito informado'}</span><span>${order.opened || ''} ate ${order.due || ''} | ${order.priority || ''}</span><span class="money">${money(order.calc?.total || 0)} | saldo ${money(order.calc?.balance || 0)}</span></div>
            </button>`).join('') || '<div class="empty">Nenhuma OS encontrada.</div>'}
            </div>
            ${pager('orders', list.length, 'renderOrders')}
          </div>
        </div>
        <div id="orderDetail">${orderDetail(selectedOrderId)}</div>
          </div>
        </div>
      </div>`;
      restoreFocus();
    }

    function selectOrder(id) {
      selectedOrderId = id;
      renderOrders();
    }

    function orderDetail(id) {
      const order = state.orders.find(item => item.id === id);
      if (!order) return `<div class="panel"><div class="panel-body muted">Selecione ou crie uma OS.</div></div>`;

      const services = order.services?.map(item => `${item.name} - garantia ${item.warranty_days || 90} dias`).join('<br>') || 'Nenhum servico';
      const history = order.status_history?.map(item => `<div class="summary-item"><strong>${item.old_status || 'Inicio'} -> ${item.new_status}</strong><span>${item.created_at || ''} ${item.user_name ? `por ${item.user_name}` : ''}<br>${item.note || ''}</span></div>`).join('') || '<div class="muted">Nenhuma movimentacao de status registrada.</div>';
      return `<div class="panel">
        <div class="panel-head"><h2>OS #${order.number}</h2>${badge(order.status)}</div>
        <div class="panel-body grid">
          <div class="detail-top"><div><h2 style="margin:0 0 4px">${order.client_name}</h2><div class="muted">${order.device_brand || ''} ${order.device_model || ''} | IMEI ${order.device_imei || 'nao informado'}</div></div><div class="money">${money(order.calc?.total || 0)}</div></div>
          <div class="detail-actions">
            ${can('os','editar') ? `<button class="primary" onclick="orderForm('${order.id}')">Editar</button>` : ''}
            ${can('financeiro','pagar') ? `<button onclick="payOrder('${order.id}')">Pagamentos</button>` : ''}
            ${can('os','finalizar') ? `<button onclick="finishOrder('${order.id}')">Finalizar OS</button>` : ''}
            ${can('os','imprimir') ? `<button onclick="printOrder('${order.id}')">Imprimir OS</button>` : ''}
            ${can('os','aprovar') ? `<button onclick="signatureForm('${order.id}','approval')">Aprovar com assinatura</button>` : ''}
            ${can('os','finalizar') ? `<button onclick="signatureForm('${order.id}','delivery')">Assinar entrega</button>` : ''}
            <button onclick="sendOrderWhatsApp('${order.id}','budget')">WhatsApp orcamento</button>
            <button onclick="sendOrderWhatsApp('${order.id}','delivery')">WhatsApp termo</button>
          </div>
          <div class="detail-grid">
            <div class="detail-item"><span>Cliente</span>${order.client_name}</div>
            <div class="detail-item"><span>Aparelho</span>${order.device_brand || ''} ${order.device_model || ''}<br><small class="muted">${order.device_imei || ''}</small></div>
            <div class="detail-item"><span>Status</span>${order.status}<br><small class="muted">${order.priority}</small></div>
            <div class="detail-item"><span>Pagamento</span>Pago ${money(order.calc?.paid || 0)}<br><small class="muted">Saldo ${money(order.calc?.balance || 0)}</small></div>

            <div class="detail-item"><span>Servicos</span>${services}</div>
            <div class="detail-item"><span>Aprovacao</span>${order.approval_signed_at ? `Assinado em ${order.approval_signed_at}` : 'Pendente'}${order.approval_signature ? `<br><img src="${order.approval_signature}" alt="Assinatura aprovacao" style="max-width:150px;max-height:58px;background:white;border:1px solid var(--line)">` : ''}</div>
            <div class="detail-item"><span>Entrega</span>${order.delivery_signed_at ? `Assinado em ${order.delivery_signed_at}` : 'Pendente'}${order.delivery_signature ? `<br><img src="${order.delivery_signature}" alt="Assinatura entrega" style="max-width:150px;max-height:58px;background:white;border:1px solid var(--line)">` : ''}</div>

          </div>
        </div>

    function photoList(order) {
      if (!order.photos?.length) return '<div class="muted">Nenhuma foto cadastrada.</div>';
      return `<div class="photo-grid">${order.photos.map(photo => `<a href="${photo.file_path}" download="${photo.file_name}" target="_blank">
        <img src="${photo.file_path}" alt="${photo.file_name}">
        <small>${photo.file_name}</small>
      </a>`).join('')}</div>`;
    }

    const osStatuses = ['Aberta','Aguardando diagnostico','Aguardando aprovacao','Aprovada','Em execucao','Aguardando peca','Finalizada','Entregue','Cancelada'];
    const warrantyDefault = `TERMO DE GARANTIA DO SERVICO PRESTADO\n\nA garantia legal do servico prestado e de 90 dias, contados a partir da data de entrega do aparelho ao cliente. A garantia cobre exclusivamente o servico executado nesta Ordem de Servico e as pecas substituidas descritas no documento.\n\nA garantia nao cobre queda, impacto, oxidacao, contato com liquido, mau uso, violacao, tentativa de reparo por terceiros, falhas de software, perda de dados ou defeitos nao relacionados ao reparo aprovado.`;

    function modelsForManufacturer(manufacturerId) {
      return state.models.filter(model => !manufacturerId || model.manufacturer_id === manufacturerId);
    }

    function partsForOrder(manufacturerId, modelId) {
      if (modelId) {
        return state.parts.filter(part => safeJson(part.compatible_models, []).includes(modelId) && (part.usage_type || 'Ambos') !== 'Venda');
      }
      if (manufacturerId) return state.parts.filter(part => part.manufacturer_id === manufacturerId && (part.usage_type || 'Ambos') !== 'Venda');
      return [];
    }

    function modelSelectOptions(manufacturerId, selected = '') {
      const models = modelsForManufacturer(manufacturerId);
      return `<option value="">Selecione o modelo</option>${models.map(model => `<option value="${model.id}" ${selected === model.id ? 'selected' : ''}>${model.name}${model.year ? ` - ${model.year}` : ''}</option>`).join('')}`;
    }

    function orderPartOptions(manufacturerId, modelId, selected = []) {
      const parts = partsForOrder(manufacturerId, modelId);
      if (!modelId && !manufacturerId) return '<div class="muted">Selecione o fabricante e o modelo para listar as pecas corretas.</div>';
      if (!parts.length) return '<div class="muted">Nenhuma peca compativel cadastrada para este modelo.</div>';
      return `<div class="check-list">${parts.map(part => `<label class="check-row"><input type="checkbox" name="parts" value="${part.id}" ${selected.includes(part.id) ? 'checked' : ''}><span>${part.name} - ${money(part.price)}<br><small>Estoque ${part.stock} | Garantia ${part.warranty_days || 90} dias</small></span></label>`).join('')}</div>`;
    }

    function syncOrderCatalog() {
      const form = document.getElementById('orderForm');
      if (!form) return;
      const manufacturerId = form.device_manufacturer_id.value;
      const modelSelect = form.device_model_id;
      const currentModel = modelSelect.value;
      modelSelect.innerHTML = modelSelectOptions(manufacturerId, currentModel);
      if (currentModel && !modelsForManufacturer(manufacturerId).some(model => model.id === currentModel)) {
        modelSelect.value = '';
      }
      syncOrderDeviceFields();
      syncOrderParts();
    }

    function syncOrderDeviceFields() {
      const form = document.getElementById('orderForm');
      if (!form) return;
      const model = state.models.find(item => item.id === form.device_model_id.value);
      form.device_brand.value = manufacturerName(form.device_manufacturer_id.value);
      if (model) form.device_model.value = model.name;
    }

    function syncOrderParts() {
      const form = document.getElementById('orderForm');
      if (!form) return;
      document.getElementById('orderPartsList').innerHTML = orderPartOptions(form.device_manufacturer_id.value, form.device_model_id.value);
    }

          <label>Status<select name="status">${osStatuses.map(status => `<option ${item.status === status ? 'selected' : ''}>${status}</option>`).join('')}</select></label>
          <label>Aprovacao<select name="approval_status">${['Pendente','Aprovada','Reprovada'].map(status => `<option ${item.approval_status === status ? 'selected' : ''}>${status}</option>`).join('')}</select></label>
          <label>Prioridade<select name="priority">${['Normal','Alta','Urgente'].map(priority => `<option ${item.priority === priority ? 'selected' : ''}>${priority}</option>`).join('')}</select></label>
          <label>Abertura<input name="opened" type="date" value="${item.opened || new Date().toISOString().slice(0,10)}"></label>
          <label>Prazo combinado<input name="due" type="date" value="${item.due || ''}"></label>
          <label>Tecnico responsavel<input name="technician_name" value="${item.technician_name || ''}"></label>
          <label>Desconto<input name="discount" type="number" step="0.01" value="${item.discount || 0}"></label>
          <label class="wide">Estado de entrada<textarea name="device_condition" placeholder="Tela, carcaca, botoes, sinais de queda, oxidacao, acessorios recebidos...">${item.device_condition || ''}</textarea></label>
          <label class="wide">Defeito relatado<textarea name="defect">${item.defect || ''}</textarea></label>
          <label class="wide">Diagnostico / laudo<textarea name="diagnosis">${item.diagnosis || ''}</textarea></label>

    function initSignaturePad() {
      const canvas = document.getElementById('signatureCanvas');
      if (!canvas) return;
      const context = canvas.getContext('2d');
      context.lineWidth = 3;
      context.lineCap = 'round';
      context.strokeStyle = '#111827';
      let drawing = false;
      const point = event => {
        const rect = canvas.getBoundingClientRect();
        const source = event.touches?.[0] || event;
        return { x: (source.clientX - rect.left) * (canvas.width / rect.width), y: (source.clientY - rect.top) * (canvas.height / rect.height) };
      };
      const start = event => {
        drawing = true;
        const p = point(event);
        context.beginPath();
        context.moveTo(p.x, p.y);
        event.preventDefault();
      };
      const move = event => {
        if (!drawing) return;
        const p = point(event);
        context.lineTo(p.x, p.y);
        context.stroke();
        event.preventDefault();
      };
      const stop = () => { drawing = false; };
      canvas.onmousedown = start;
      canvas.onmousemove = move;
      canvas.onmouseup = stop;
      canvas.onmouseleave = stop;
      canvas.ontouchstart = start;
      canvas.ontouchmove = move;
      canvas.ontouchend = stop;
    }

    function clearSignature() {
      const canvas = document.getElementById('signatureCanvas');
      if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

    function fileToDataUrl(file) {

        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function supplierName(id) {
      return state.suppliers.find(supplier => supplier.id === id)?.name || '';
    }

    function partOutgoing(partId) {
      return (state.stock_movements || []).filter(mov => mov.part_id === partId && mov.type === 'Saida').reduce((sum, mov) => sum + Number(mov.quantity || 0), 0);
    }

    function reorderQty(part) {
      const stock = Number(part.stock || 0);
      const min = Number(part.min_stock || 0);
      const giro = partOutgoing(part.id);
      const target = Math.max(min * 2, Math.ceil(giro / 2), min + 1);
      return Math.max(0, target - stock);
    }

    function reorderText(part) {
      const qty = reorderQty(part);
      if (!qty) return '<span class="pill green">OK</span>';
      return `<span class="pill amber">Comprar ${qty}</span>`;
    }

    function stockBadge(part) {
      const stock = Number(part.stock || 0);
      const min = Number(part.min_stock || 0);
      if (stock <= 0) return '<span class="pill red">Sem estoque</span>';
      if (stock <= min) return '<span class="pill amber">Reposicao</span>';
      return '<span class="pill green">Recebido</span>';
    }

    function permissionMatrix(current) {
      return `<div style="overflow:auto"><table><thead><tr><th>Modulo</th><th>Permissoes</th></tr></thead><tbody>${permissionModules.map(([module, label, actions]) => `
        <tr><td><strong>${label}</strong><br><small class="muted">${module}</small></td><td>${actions.map(action => `<label style="display:inline-flex;align-items:center;gap:6px;margin:4px 10px 4px 0;text-transform:none;color:var(--ink);font-weight:500"><input type="checkbox" name="perm_${module}" value="${action}" ${(current[module] || []).includes(action) ? 'checked' : ''}> ${action}</label>`).join('')}</td></tr>
      `).join('')}</tbody></table></div>`;
    }

    function roleForm(id = '') {
      const item = state.roles.find(row => row.id === id) || {};

      formPanel(id ? 'Editar perfil' : 'Novo perfil', `

        <label>Nivel<input name="level" type="number" value="${item.level || 0}"></label>
        <div class="wide"><label>Escala de permissoes</label>${permissionMatrix(current)}</div>
      `, form => {
        const data = Object.fromEntries(form.entries());
        data.permissions = {};
        permissionModules.forEach(([module]) => {
          const actions = form.getAll(`perm_${module}`);
          if (actions.length) data.permissions[module] = actions;
        });
        return saveRecord('roles', id, data);
      }, 'users');
    }

    async function saveRecord(section, id, data) {

    function safeJson(value, fallback) {

    function posForm() {
      const todayValue = new Date().toISOString().slice(0,10);
      const itemRows = Array.from({ length: 6 }, (_, index) => `
        <div class="form-grid wide" style="grid-template-columns:2fr 1fr 1fr;margin-bottom:8px">
          <label>Item ${index + 1}<select name="part_id_${index}"><option value="">Selecione</option>${posPartOptions()}</select></label>
          <label>Qtd<input name="quantity_${index}" type="number" min="0" value="0"></label>
          <label>Preco unit.<input name="unit_price_${index}" type="number" step="0.01" value="0"></label>
        </div>`).join('');
      formPanel('Nova venda PDV', `
        <label>Cliente<select name="client_id"><option value="">Cliente avulso</option>${state.clients.map(client => `<option value="${client.id}">${client.name}</option>`).join('')}</select></label>
        <label>Data<input name="date" type="date" value="${todayValue}"></label>
        <label>Forma pagamento<select name="payment_method">${['Dinheiro','PIX','Cartao','Boleto','Transferencia'].map(value => `<option>${value}</option>`).join('')}</select></label>
        <label>Status<select name="status">${['Recebido','Pendente'].map(value => `<option>${value}</option>`).join('')}</select></label>

        <label class="wide">Observacoes<textarea name="notes"></textarea></label>
        <div class="wide"><h2>Itens da venda</h2>${itemRows}</div>
      `, form => {
        const data = Object.fromEntries(form.entries());
        data.items = [];
        for (let index = 0; index < 6; index++) {
          if (data[`part_id_${index}`] && Number(data[`quantity_${index}`] || 0) > 0) {
            const part = state.parts.find(item => item.id === data[`part_id_${index}`]);
            data.items.push({ part_id: data[`part_id_${index}`], quantity: Number(data[`quantity_${index}`] || 0), unit_price: Number(data[`unit_price_${index}`] || part?.price || 0) });
          }
          delete data[`part_id_${index}`];
          delete data[`quantity_${index}`];
          delete data[`unit_price_${index}`];
        }
        return api('/api/pos-sales', { method:'POST', body: JSON.stringify(data) });
      }, 'pos');
