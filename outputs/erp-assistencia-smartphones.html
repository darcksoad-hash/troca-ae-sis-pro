          const unitCost = Number(form.get('unitCost') || 0);
          if (part && qty > 0) {
            const currentStock = Number(part.stock || 0);
            const currentCost = Number(part.cost || 0);
            part.cost = currentStock + qty > 0 ? ((currentStock * currentCost) + (qty * unitCost)) / (currentStock + qty) : unitCost;
            part.stock = currentStock + qty;
            db.stockMovements.unshift({ id: uid('mov'), date: form.get('date'), partId: part.id, type: 'Entrada', qty, unitCost, reason: form.get('reason'), supplierId: form.get('supplierId') });
            audit('Entrada de estoque', `${part.name}: ${qty} un. de ${supplierName(form.get('supplierId'))}`);
          }
          save();
        });
    }

    function markFinancePaid(id) {
      const item = db.finance.find(f => f.id === id);
      if (!item) return;
      item.status = item.type === 'Entrada' ? 'Recebido' : 'Pago';
      item.date = today();
      audit('Conta baixada', `${item.description}: ${money.format(item.amount)}`);
      save();
    }

    function setApproval(id, status) {
      const order = db.orders.find(o => o.id === id);
      if (!order) return;
      order.approvalStatus = status;
      order.status = status === 'Aprovada' ? 'Aprovada' : 'Cancelada';
      audit(status === 'Aprovada' ? 'Orçamento aprovado' : 'Orçamento reprovado', `OS ${order.number}`);
      save();
    }

    function showOrderTerm(id) {
      const order = db.orders.find(o => o.id === id);
      if (!order) return;
      const calc = calcOrder(order);
      openModal(`Termo da OS ${order.number}`, `
        <div class="grid">
          <p><strong>Cliente:</strong> ${escapeHtml(clientName(order.clientId))}</p>
          <p><strong>Aparelho:</strong> ${escapeHtml(deviceName(order))} - IMEI/Serial ${escapeHtml(order.deviceImei || '')}</p>
          <p><strong>Defeito:</strong> ${escapeHtml(order.defect || '')}</p>
          <p><strong>Laudo/Solução:</strong> ${escapeHtml(order.solution || order.diagnosis || '')}</p>
          <p><strong>Garantia:</strong> ${escapeHtml(order.warrantyTerm || 'Garantia conforme serviço executado.')}</p>
          <p><strong>Entrega:</strong> ${escapeHtml(order.deliveryTerm || 'Aparelho entregue ao cliente após testes.')}</p>
          <p><strong>Total:</strong> ${money.format(calc.total)} | <strong>Saldo:</strong> ${money.format(calc.balance)}</p>
        </div>`, () => {});
    }

    function printOrder(id) {
      const order = db.orders.find(o => o.id === id);
      if (!order) return;
      const client = db.clients.find(c => c.id === order.clientId) || {};
      const company = db.company || seed.company;
      const companyAddress = [company.street, company.number, company.neighborhood, company.city, company.state, company.zip].filter(Boolean).map(escapeHtml).join(' - ');
      const calc = calcOrder(order);
      const parts = order.parts.map(item => {
        const part = db.parts.find(p => p.id === item.id);
        return part ? `<tr><td>${escapeHtml(part.name)}</td><td>${item.qty || 1}</td><td>${money.format(part.price)}</td></tr>` : '';
      }).join('');
      const services = order.services.map(id => {
        const service = db.services.find(s => s.id === id);
        return service ? `<tr><td>${escapeHtml(service.name)}</td><td>${escapeHtml(service.duration || '')}</td><td>${money.format(service.labor)}</td></tr>` : '';
      }).join('');
      const html = `
        <!doctype html><html><head><meta charset="utf-8"><title>OS ${order.number}</title>
        <style>
          @page{size:A4;margin:7mm}
          *{box-sizing:border-box}
          body{font-family:Arial,sans-serif;color:#1d2522;margin:0;background:#f6f7f9;font-size:10.5px;line-height:1.22}
          .page{background:white;margin:10px auto;padding:10px;max-width:794px;border-top:5px solid ${escapeHtml(company.primaryColor || '#f9732f')}}
          h1{font-size:18px;margin:0 0 3px} h2{font-size:11.5px;margin:7px 0 4px;border-bottom:1.5px solid ${escapeHtml(company.primaryColor || '#f9732f')};padding-bottom:3px}
          p{margin:3px 0;white-space:pre-line}.top{display:grid;grid-template-columns:1fr 190px;gap:10px}.company{display:flex;gap:10px;align-items:flex-start}.logo{width:58px;max-height:58px;object-fit:contain}.box{border:1px solid #ddd;padding:6px;border-radius:6px;background:#fafafa}
          .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.compact{display:grid;gap:3px}
          table{width:100%;border-collapse:collapse;margin-top:3px}td,th{border:1px solid #e1e4e8;padding:4px;text-align:left;font-size:10px;vertical-align:top}th{background:#f7f7f7}
          .muted{color:#666}.total{font-size:12px;font-weight:bold;text-align:right;margin-top:6px;background:#fff4ed;padding:7px;border-radius:6px}.warranty{font-size:9.2px;line-height:1.16}.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:18px}.line{border-top:1px solid #333;text-align:center;padding-top:5px}
          @media print{button{display:none}.page{margin:0;padding:0;border-top-width:4px}body{background:white}}
        </style></head><body><div class="page">
        <div class="top">
          <div class="company">
            ${company.logo ? `<img class="logo" src="${escapeHtml(company.logo)}" alt="Logo">` : ''}
            <div><h1>Ordem de Serviço #${order.number}</h1><div class="muted"><strong>${escapeHtml(company.tradeName || company.systemName || 'Troca Âe SIS PRO')}</strong><br>${escapeHtml(company.legalName || '')}<br>${escapeHtml(company.document || '')} ${escapeHtml(company.phone || '')}<br>${escapeHtml(company.email || '')}<br>${companyAddress}</div></div>
          </div>
          <div class="box"><strong>Status:</strong> ${escapeHtml(order.status)}<br><strong>Aprovação:</strong> ${escapeHtml(order.approvalStatus || '')}<br><strong>Prioridade:</strong> ${escapeHtml(order.priority || '')}<br><strong>Abertura:</strong> ${order.opened}<br><strong>Previsão:</strong> ${order.due}<br><strong>Técnico:</strong> ${escapeHtml(order.technician || '')}</div>
        </div>
        <div class="grid2">
          <div><h2>Cliente</h2><p><strong>${escapeHtml(client.name || '')}</strong><br>${escapeHtml(client.phone || '')} | ${escapeHtml(client.email || '')}<br>${escapeHtml(client.document || '')}<br>${[client.street, client.number, client.neighborhood, client.city, client.state, client.zip].filter(Boolean).map(escapeHtml).join(' - ')}</p></div>
          <div><h2>Aparelho</h2><p><strong>${escapeHtml(deviceName(order))}</strong><br>IMEI/Serial: ${escapeHtml(order.deviceImei || '')}<br>Cor: ${escapeHtml(order.deviceColor || '')} | Senha/padrão: ${escapeHtml(order.devicePassword || '')}<br>Entrada: ${escapeHtml(order.deviceCondition || '')}</p></div>
        </div>
        <h2>Atendimento</h2>
        <div class="grid3 compact">
          <p><strong>Defeito:</strong><br>${escapeHtml(order.defect || '')}</p>
          <p><strong>Diagnóstico/Orçamento:</strong><br>${escapeHtml(order.diagnosis || '')}</p>
          <p><strong>Laudo/Solução:</strong><br>${escapeHtml(order.solution || '')}</p>
        </div>
        <div class="grid2">
          <div><h2>Peças</h2><table><thead><tr><th>Peça</th><th>Qtd.</th><th>Valor</th></tr></thead><tbody>${parts || '<tr><td colspan="3">Sem peças.</td></tr>'}</tbody></table></div>
          <div><h2>Serviços</h2><table><thead><tr><th>Serviço</th><th>Prazo</th><th>Valor</th></tr></thead><tbody>${services || '<tr><td colspan="3">Sem serviços.</td></tr>'}</tbody></table></div>
        </div>
        <div class="total">Total: ${money.format(calc.total)} | Desconto: ${money.format(order.discount || 0)} | Pago: ${money.format(order.paid || 0)} | Saldo: ${money.format(calc.balance)}</div>
        <div class="grid2">
          <p><strong>Fotos/anexos:</strong> ${escapeHtml(order.photos || 'Não informado.')} ${(order.photoFiles || []).length ? `(${(order.photoFiles || []).length} foto(s) cadastrada(s))` : ''}</p>
          <p><strong>Pós-venda:</strong> ${escapeHtml(order.followUp || 'Não informado.')}</p>
        </div>
        <h2>Garantia e entrega</h2>
        <p class="warranty">${escapeHtml(order.warrantyTerm || company.defaultWarrantyTerm || 'Garantia conforme serviço executado.')}</p>
        <p>${escapeHtml(order.deliveryTerm || 'Aparelho recebido/entregue conforme condições registradas nesta OS.')}</p>
        <p class="muted">${escapeHtml(company.printFooter || '')}</p>
        <div class="sign"><div class="line">Cliente</div><div class="line">Responsável técnico</div></div>
        <button onclick="window.print()">Imprimir</button>
        </div></body></html>`;
      const printWindow = window.open('', '_blank');
      if (!printWindow) {
        alert('O navegador bloqueou a janela de impressão.');
        return;
      }
      printWindow.document.write(html);
      printWindow.document.close();
      audit('Impressão de OS', `OS ${order.number}`);
      save();
    }

    function openModal(title, body, onSave) {
      const modal = document.getElementById('modal');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = body;
      document.getElementById('modalForm').onsubmit = async event => {
        if (event.submitter?.value === 'cancel') {
          event.preventDefault();
          closeModal();
          return;
        }
        event.preventDefault();
        await onSave();
        closeModal();
      };
      if (typeof modal.showModal === 'function') modal.showModal();
      else modal.setAttribute('open', '');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      if (typeof modal.close === 'function') modal.close();
      else modal.removeAttribute('open');
    }

    function removeItem(section, id) {
      if (!confirm('Excluir este registro?')) return;
      const item = db[section].find(x => x.id === id);
      db[section] = db[section].filter(x => x.id !== id);
      audit('Registro excluído', `${section}: ${item?.name || item?.sku || item?.email || id}`);
      save();
    }

    function removeFinance(id) {
      if (!confirm('Excluir este lançamento?')) return;
      const item = db.finance.find(f => f.id === id);
      db.finance = db.finance.filter(f => f.id !== id);
      audit('Lançamento excluído', item?.description || id);
      save();
    }

    function payOrder(id) {
      const order = db.orders.find(o => o.id === id);
      const calc = calcOrder(order);
      const amount = Number(prompt(`Valor do pagamento para OS ${order.number}`, Math.max(0, calc.balance).toFixed(2)));
      if (!amount) return;
      order.paid = Number(order.paid || 0) + amount;
      db.finance.push({ id: uid('fin'), type: 'Entrada', date: today(), dueDate: today(), category: 'Pagamento OS', description: `Pagamento OS ${order.number}`, amount, status: 'Recebido', paymentMethod: 'PIX', orderId: order.id });
      audit('Pagamento registrado', `OS ${order.number}: ${money.format(amount)}`);
      save();
    }

    function finishOrder(id) {
      const order = db.orders.find(o => o.id === id);
      if (!confirm(`Finalizar OS ${order.number}?`)) return;
      order.status = 'Finalizada';
      order.parts.forEach(item => {
        const part = db.parts.find(p => p.id === item.id);
        if (part) {
          const qty = Number(item.qty || 1);
          part.stock = Math.max(0, Number(part.stock) - qty);
          db.stockMovements.unshift({ id: uid('mov'), date: today(), partId: part.id, type: 'Saída', qty, unitCost: Number(part.cost || 0), reason: `Baixa por OS ${order.number}`, supplierId: '' });
        }
      });
      audit('OS finalizada', `OS ${order.number}`);
      save();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `troca-ae-sis-pro-${today()}.json`;
      link.click();
    }

    function exportReport(type) {
      syncReportPeriodFromInputs();
      const reports = {
        clients: {
          name: 'clientes',
          rows: db.clients,
          columns: [
            ['Nome', r => r.name], ['Telefone', r => r.phone], ['Email', r => r.email], ['Documento', r => r.document],
            ['CEP', r => r.zip], ['Logradouro', r => r.street], ['Numero', r => r.number], ['Bairro', r => r.neighborhood],
            ['Cidade', r => r.city], ['UF', r => r.state], ['Complemento', r => r.complement], ['Observacoes', r => r.notes]
          ]
        },
        orders: {
          name: 'ordens-servico',
          rows: db.orders.filter(r => rowInReportPeriod(r.opened)),
          columns: [
            ['OS', r => r.number], ['Cliente', r => clientName(r.clientId)], ['Aparelho', r => deviceName(r)], ['IMEI', r => r.deviceImei],
            ['Status', r => r.status], ['Aprovacao', r => r.approvalStatus], ['Prioridade', r => r.priority], ['Abertura', r => r.opened],
            ['Previsao', r => r.due], ['Tecnico', r => r.technician], ['Defeito', r => r.defect], ['Diagnostico', r => r.diagnosis],
            ['Solucao', r => r.solution], ['Pecas', r => r.parts.map(p => partName(p.id)).join(', ')], ['Servicos', r => r.services.map(id => db.services.find(s => s.id === id)?.name).filter(Boolean).join(', ')],
            ['Total', r => calcOrder(r).total], ['Pago', r => r.paid], ['Saldo', r => calcOrder(r).balance], ['Garantia', r => r.warrantyTerm], ['Pos venda', r => r.followUp]
          ]
        },
        parts: {
          name: 'pecas',
          rows: db.parts,
          columns: [
            ['SKU', r => r.sku], ['Nome', r => r.name], ['Categoria', r => r.category], ['Fabricante', r => manufacturerName(r.manufacturerId)],
            ['Modelos compativeis', r => (r.compatibleModels || []).map(modelName).join(', ')], ['Custo medio', r => r.cost], ['Preco', r => r.price],
            ['Estoque', r => r.stock], ['Minimo', r => r.min], ['Fornecedor', r => r.supplier]
          ]
        },
        finance: {
          name: 'financeiro',
          rows: db.finance.filter(r => rowInReportPeriod(r.date || r.dueDate)),
          columns: [
            ['Data', r => r.date], ['Vencimento', r => r.dueDate], ['Tipo', r => r.type], ['Categoria', r => r.category],
            ['Descricao', r => r.description], ['Valor', r => r.amount], ['Status', r => r.status], ['Forma pagamento', r => r.paymentMethod],
            ['OS', r => db.orders.find(o => o.id === r.orderId)?.number || '']
          ]
        },
        manufacturers: {
          name: 'fabricantes',
          rows: db.manufacturers,
          columns: [['Nome', r => r.name], ['Suporte', r => r.supportPhone], ['Site', r => r.site], ['Modelos', r => db.productModels.filter(m => m.manufacturerId === r.id).length], ['Observacoes', r => r.notes]]
        },
        models: {
          name: 'modelos',
          rows: db.productModels,
          columns: [['Fabricante', r => manufacturerName(r.manufacturerId)], ['Modelo', r => r.name], ['Categoria', r => r.category], ['Ano', r => r.year], ['Observacoes', r => r.notes]]
        },
        services: {
          name: 'servicos',
          rows: db.services,
          columns: [['Nome', r => r.name], ['Categoria', r => r.category], ['Mao de obra', r => r.labor], ['Garantia dias', r => r.warranty], ['Duracao', r => r.duration]]
        },
        stock: {
          name: 'movimentacao-estoque',
          rows: (db.stockMovements || []).filter(r => rowInReportPeriod(r.date)),
          columns: [['Data', r => r.date], ['Peca', r => partName(r.partId)], ['Tipo', r => r.type], ['Quantidade', r => r.qty], ['Custo unitario', r => r.unitCost], ['Fornecedor', r => supplierName(r.supplierId)], ['Motivo', r => r.reason]]
        }
      };
      const report = reports[type];
      if (!report) return;
      exportExcel(report.name, report.rows, report.columns);
    }

    function exportExcel(name, rows, columns) {
      const table = `<table><thead><tr>${columns.map(([label]) => `<th>${escapeHtml(label)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${columns.map(([, getter]) => `<td>${escapeHtml(getter(row) ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      const html = `<!doctype html><html><head><meta charset="utf-8"></head><body>${table}</body></html>`;
      const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${name}-${today()}.xls`;
      link.click();
    }

    document.getElementById('quickOsBtn').onclick = () => openOrderModal();
    document.getElementById('resetBtn').onclick = reset;
    document.getElementById('exportBtn').onclick = exportData;
    document.getElementById('sidebarPinBtn').onclick = toggleSidebarFixed;
    applyBranding();
    updateSidebarPin();
    render();
  </script>
</body>
</html>
