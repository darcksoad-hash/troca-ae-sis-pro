<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Troca Âe SIS PRO</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --surface: #ffffff;
      --surface-2: #f2f4f7;
      --ink: #20242a;
      --muted: #667085;
      --line: #e4e7ec;
      --green: #f9732f;
      --green-2: #fff1e8;
      --blue: #1d5f8f;
      --blue-2: #e3eff8;
      --amber: #9a6b12;
      --amber-2: #fff2ce;
      --red: #aa3a35;
      --red-2: #fae7e5;
      --shadow: 0 14px 34px rgba(16, 24, 40, .08);
      --radius: 8px;
      --sidebar-width: 72px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(249, 115, 47, .10), transparent 34%),
        linear-gradient(180deg, #fbfcff 0%, var(--bg) 38%);
      color: var(--ink);
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
      transition: grid-template-columns .22s ease;
    }

    body.sidebar-fixed {
      --sidebar-width: 268px;
    }

    body.sidebar-fixed .app {
      grid-template-columns: 268px minmax(0, 1fr);
    }

    body.sidebar-fixed aside {
      width: 268px;
      padding-left: 16px;
      padding-right: 16px;
    }

    aside {
      background: rgba(255, 255, 255, .92);
      color: var(--ink);
      padding: 22px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      width: 268px;
      max-width: 268px;
      overflow: hidden;
      border-right: 1px solid var(--line);
      box-shadow: 8px 0 30px rgba(16, 24, 40, .05);
      backdrop-filter: blur(12px);
      z-index: 20;
      transition: width .22s ease, box-shadow .22s ease;
    }

    body:not(.sidebar-fixed) aside {
      width: 72px;
      padding-left: 10px;
      padding-right: 10px;
    }

    body:not(.sidebar-fixed) aside:hover {
      width: 268px;
      box-shadow: 18px 0 42px rgba(16, 24, 40, .13);
    }

    .sidebar-pin {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 9px;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--green);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 8px 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
      min-width: 236px;
    }

    .brand-text {
      min-width: 135px;
      transition: opacity .18s ease;
    }

    body:not(.sidebar-fixed) aside:not(:hover) .brand-text,
    body:not(.sidebar-fixed) aside:not(:hover) .nav-label {
      opacity: 0;
      pointer-events: none;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--brand-primary, #f9732f);
      color: white;
      font-weight: 800;
    }

    .brand strong { display: block; font-size: 16px; }
    .brand span { color: var(--muted); font-size: 12px; }
    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: contain;
      background: white;
      display: none;
      padding: 3px;
      border: 1px solid #ffe0cf;
    }

    nav {
      display: grid;
      gap: 5px;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #475467;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      min-width: 236px;
    }

    .nav-btn:hover {
      background: #fff4ed;
      color: var(--green);
    }

    .nav-btn.active {
      background: var(--green);
      color: white;
      box-shadow: 0 10px 20px rgba(249, 115, 47, .22);
    }

    .nav-ico { width: 22px; text-align: center; }
    .nav-label { transition: opacity .18s ease; }

    main {
      min-width: 0;
      padding: 24px 28px;
      width: 100%;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, .82);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.15;
    }

    .sub {
      color: var(--muted);
      margin-top: 5px;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 9px;
      padding: 9px 12px;
      cursor: pointer;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      min-height: 38px;
      white-space: nowrap;
    }

    .btn.primary {
      border-color: var(--green);
      background: var(--green);
      color: white;
      box-shadow: 0 8px 18px rgba(249, 115, 47, .22);
    }

    .btn.warn {
      border-color: var(--amber);
      color: var(--amber);
    }

    .btn.danger {
      border-color: var(--red);
      color: var(--red);
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .kpis {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 18px;
    }

    .kpi, .panel, .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .kpi {
      padding: 17px;
      min-height: 110px;
      border-top: 3px solid var(--green);
    }

    .kpi span {
      color: var(--muted);
      font-size: 13px;
    }

    .kpi strong {
      display: block;
      font-size: 29px;
      margin-top: 12px;
    }

    .kpi small {
      display: block;
      color: var(--muted);
      margin-top: 6px;
    }

    .two {
      grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr);
    }

    .ops-layout {
      display: grid;
      grid-template-columns: minmax(320px, .85fr) minmax(0, 1.15fr);
      gap: 14px;
      align-items: start;
    }

    .os-list {
      display: grid;
      gap: 9px;
      max-height: calc(100vh - 285px);
      overflow: auto;
      padding-right: 3px;
    }

    .os-card {
      border: 1px solid var(--line);
      background: white;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      display: grid;
      gap: 8px;
      text-align: left;
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }

    .os-card:hover, .os-card.active {
      border-color: var(--green);
      box-shadow: 0 10px 22px rgba(249, 115, 47, .14);
      transform: translateY(-1px);
    }

    .os-card-top, .detail-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .os-card strong {
      font-size: 15px;
    }

    .os-meta, .detail-grid {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .detail-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      color: var(--ink);
      margin-top: 14px;
    }

    .detail-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fbfcfd;
      min-height: 62px;
    }

    .detail-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .detail-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .status-strip {
      height: 5px;
      border-radius: 999px;
      background: var(--green);
    }

    .panel {
      overflow: hidden;
      background: rgba(255,255,255,.94);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 17px;
      border-bottom: 1px solid var(--line);
      gap: 12px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 17px;
    }

    .panel-body {
      padding: 14px 16px;
      overflow-x: auto;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px 180px;
      gap: 10px;
      margin-bottom: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 8px;
      padding: 10px 11px;
      min-height: 40px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      background: #f9fafb;
    }

    tr:last-child td { border-bottom: 0; }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 9px;
      cursor: pointer;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.green { background: var(--green-2); color: var(--green); }
    .pill.blue { background: var(--blue-2); color: var(--blue); }
    .pill.amber { background: var(--amber-2); color: var(--amber); }
    .pill.red { background: var(--red-2); color: var(--red); }

    .muted { color: var(--muted); }
    .money { font-variant-numeric: tabular-nums; font-weight: 750; }
    .section { display: none; }
    .section.active { display: block; }

    body.dark-mode {
      --bg: #111418;
      --surface: #171b21;
      --surface-2: #20252d;
      --ink: #f4f6f8;
      --muted: #aab2bf;
      --line: #2c3440;
      --shadow: 0 14px 34px rgba(0, 0, 0, .25);
      background: #111418;
    }

    body.dark-mode aside,
    body.dark-mode header,
    body.dark-mode .panel,
    body.dark-mode .kpi,
    body.dark-mode .os-card,
    body.dark-mode .detail-item {
      background: var(--surface);
      color: var(--ink);
    }

    body.dark-mode input,
    body.dark-mode select,
    body.dark-mode textarea,
    body.dark-mode .btn,
    body.dark-mode .icon-btn {
      background: #101318;
      color: var(--ink);
      border-color: var(--line);
    }

    body.dark-mode th {
      background: var(--surface-2);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-grid .wide { grid-column: 1 / -1; }

    dialog {
      position: fixed;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      width: min(760px, calc(100vw - 28px));
      border: 0;
      border-radius: 8px;
      padding: 0;
      box-shadow: 0 24px 80px rgba(24, 35, 31, .28);
    }

    dialog:not([open]) {
      display: none;
    }

    dialog::backdrop {
      background: rgba(17, 24, 21, .42);
    }

    .modal-head, .modal-foot {
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .modal-foot {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 18px;
    }

    .modal-body {
      padding: 18px;
      max-height: 72vh;
      overflow: auto;
    }

    .timeline {
      display: grid;
      gap: 10px;
    }

    .event {
      border-left: 4px solid var(--green);
      padding: 9px 0 9px 12px;
    }

    .event strong { display: block; }
    .event span { color: var(--muted); font-size: 13px; }

    .bars {
      display: grid;
      gap: 12px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 130px 1fr 90px;
      gap: 10px;
      align-items: center;
      font-size: 14px;
    }

    .bar-track {
      background: var(--surface-2);
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      background: var(--green);
      height: 100%;
      border-radius: 999px;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, .65fr);
      gap: 14px;
      align-items: stretch;
    }

    .chart-list {
      display: grid;
      gap: 10px;
    }

    .mini-chart-row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) 72px;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .mini-track {
      height: 9px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .mini-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--green);
    }

    .summary-list {
      display: grid;
      gap: 9px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fbfcfd;
      font-size: 13px;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .pager select {
      width: auto;
      min-height: 34px;
      padding: 6px 8px;
    }

    .pager .btn {
      padding: 8px 10px;
      min-height: 34px;
    }

    .selected-row {
      background: rgba(249, 115, 47, 0.09);
    }

    .report-period {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .photo-manager {
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #fbfcfd;
      display: grid;
      gap: 10px;
    }

    .photo-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .photo-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      padding: 8px;
      display: grid;
      gap: 8px;
    }

    .photo-item img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 6px;
      background: var(--surface-2);
    }

    .permission-grid {
      overflow: auto;
    }

    .permission-grid table {
      min-width: 760px;
    }

    .export-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      body.sidebar-fixed .app { grid-template-columns: 1fr; }
      aside {
        position: static;
        height: auto;
        width: 100% !important;
        max-width: none;
        padding: 14px;
      }
      body:not(.sidebar-fixed) aside:not(:hover) .brand-text,
      body:not(.sidebar-fixed) aside:not(:hover) .nav-label {
        opacity: 1;
        pointer-events: auto;
      }
      .brand { min-width: 0; padding-bottom: 12px; }
      nav {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .nav-btn { min-width: 0; justify-content: flex-start; }
      .kpis, .two { grid-template-columns: 1fr; }
      .dash-grid { grid-template-columns: 1fr; }
      .export-grid { grid-template-columns: 1fr 1fr; }
      .report-period { grid-template-columns: 1fr 1fr; }
      .ops-layout { grid-template-columns: 1fr; }
      .os-list { max-height: none; }
      .filters { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
      .toolbar { justify-content: flex-start; }
    }

    @media (min-width: 981px) and (max-width: 1280px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two, .ops-layout, .dash-grid { grid-template-columns: 1fr; }
      .filters { grid-template-columns: minmax(180px, 1fr) 150px 150px; }
    }

    @media (max-width: 640px) {
      main { padding: 14px; }
      nav { grid-template-columns: 1fr 1fr; }
      .brand { align-items: flex-start; }
      .toolbar, .detail-actions, .actions, .pager { width: 100%; justify-content: flex-start; }
      .pager { flex-wrap: wrap; }
      .btn { white-space: normal; }
      .form-grid { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: 1fr; }
      dialog { width: calc(100vw - 16px); }
      .modal-body { padding: 14px; max-height: 76vh; }
      .report-period { grid-template-columns: 1fr; }
      th:nth-child(3), td:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <img class="brand-logo" id="brandLogo" alt="Logo da empresa">
        <div class="brand-mark" id="brandMark">SIS</div>
        <div class="brand-text">
          <strong id="brandName">Troca Âe SIS PRO</strong>
          <span id="brandSubtitle">Assistência técnica</span>
        </div>
        <button class="sidebar-pin" id="sidebarPinBtn" type="button" title="Fixar menu">⇔</button>
      </div>
      <nav id="nav"></nav>
    </aside>

    <main>
      <header>
        <div>
          <h1 id="pageTitle">Painel geral</h1>
          <div class="sub" id="pageSub">Controle completo da operação, estoque e financeiro.</div>
        </div>
        <div class="toolbar">
          <button class="btn" id="exportBtn" title="Exportar dados">⬇ Exportar</button>
          <button class="btn" id="resetBtn" title="Restaurar dados de exemplo">↻ Restaurar</button>
          <button class="btn primary" id="quickOsBtn">+ Nova OS</button>
        </div>
      </header>

      <section class="section active" id="dashboard"></section>
      <section class="section" id="orders"></section>
      <section class="section" id="clients"></section>
      <section class="section" id="manufacturers"></section>
      <section class="section" id="parts"></section>
      <section class="section" id="services"></section>
      <section class="section" id="finance"></section>
      <section class="section" id="reports"></section>
      <section class="section" id="settings"></section>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="icon-btn" value="cancel" title="Fechar" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <button class="btn" value="cancel">Cancelar</button>
        <button class="btn primary" id="saveBtn" value="default">Salvar</button>
      </div>
    </form>
  </dialog>

  <script>
    const money = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
    const today = () => new Date().toISOString().slice(0, 10);
    const uid = prefix => `${prefix}-${Math.random().toString(36).slice(2, 8)}-${Date.now().toString(36)}`;
    const defaultWarrantyTerm = `TERMO DE GARANTIA DO SERVIÇO PRESTADO

A garantia legal do serviço prestado é de 90 dias, contados a partir da data de entrega do aparelho ao cliente, conforme o Código de Defesa do Consumidor. A garantia cobre exclusivamente o serviço executado nesta Ordem de Serviço e as peças substituídas que estiverem descritas no documento.

Durante o prazo de garantia, a assistência técnica fará nova avaliação do aparelho sem custo quando o defeito apresentado estiver diretamente relacionado ao reparo realizado. Caso seja comprovado defeito do serviço ou da peça aplicada, será realizado o reparo necessário dentro das condições técnicas possíveis.

      return pageState[key];

    function paginate(key, rows) {
      const page = getPage(key, rows.length);

    function pager(key, total, callbackName) {
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      const page = getPage(key, total);
      if (total <= pageSize) return '';
      return `<div class="pager"><span>${total} registros</span><button class="btn" ${page <= 1 ? 'disabled' : ''} onclick="changePage('${key}', -1, '${callbackName}')">Anterior</button><span>Página</span><select onchange="setPage('${key}', this.value, '${callbackName}')">${Array.from({ length: totalPages }, (_, i) => `<option value="${i + 1}" ${page === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select><span>de ${totalPages}</span><button class="btn" ${page >= totalPages ? 'disabled' : ''} onclick="changePage('${key}', 1, '${callbackName}')">Próximo</button></div>`;

    function reset() {
      if (!confirm('Restaurar os dados de exemplo?')) return;
      db = structuredClone(seed);
      db = migrate(db);
      save();
    }

    function calcOrder(order) {
      const partTotal = order.parts.reduce((sum, item) => {
        const part = db.parts.find(p => p.id === item.id);
        return sum + (part ? part.price * Number(item.qty || 0) : 0);
      }, 0);
      const serviceTotal = order.services.reduce((sum, id) => {
        const service = db.services.find(s => s.id === id);
        return sum + (service ? Number(service.labor || 0) : 0);
      }, 0);
      const total = partTotal + serviceTotal - Number(order.discount || 0);
      return { partTotal, serviceTotal, total, balance: total - Number(order.paid || 0) };
    }

    function clientName(id) {
      return db.clients.find(c => c.id === id)?.name || 'Cliente removido';
    }

    function manufacturerName(id) {
      return db.manufacturers.find(m => m.id === id)?.name || 'Sem fabricante';
    }

    function modelName(id) {
      return db.productModels.find(m => m.id === id)?.name || 'Modelo livre';
    }

    function roleName(id) {
      return db.roles.find(r => r.id === id)?.name || 'Perfil removido';
    }

    function partName(id) {
      return db.parts.find(p => p.id === id)?.name || 'Peça removida';
    }

    function supplierName(id) {
      return db.suppliers.find(s => s.id === id)?.name || 'Sem fornecedor';
    }

    function deviceName(order) {
      const brand = order.deviceManufacturerId ? manufacturerName(order.deviceManufacturerId) : order.deviceBrand;
      const model = order.deviceModelId ? modelName(order.deviceModelId) : order.deviceModel;
      const name = `${brand || ''} ${model || ''}`.trim();
      return name || 'Aparelho não informado';
    }

    function clientAddress(client) {
      const line = [client.street, client.number].filter(Boolean).join(', ');
      const place = [client.neighborhood, client.city, client.state].filter(Boolean).join(' - ');
      return [line, place, client.zip].filter(Boolean).join('<br>');
    }

    function badge(status) {
      const color = {
        'Recebido': 'green', 'Pago': 'green', 'Finalizada': 'green', 'Aprovada': 'green', 'Entregue': 'green',
        'Em execução': 'blue', 'Entrada': 'blue',
        'Aguardando aprovação': 'amber', 'Aguardando diagnóstico': 'amber', 'Aguardando peça': 'amber', 'Pendente': 'amber', 'Aberta': 'amber',
        'Cancelada': 'red', 'Saída': 'red', 'Reprovada': 'red'
      }[status] || 'blue';
      return `<span class="pill ${color}">${status}</span>`;
    }

    function statusColor(status) {
      if (['Finalizada', 'Aprovada', 'Entregue', 'Pago', 'Recebido'].includes(status)) return '#16a36a';
      if (['Em execução', 'Entrada'].includes(status)) return '#1d5f8f';
      if (['Aguardando aprovação', 'Aguardando diagnóstico', 'Aguardando peça', 'Pendente', 'Aberta'].includes(status)) return '#d99116';
      if (['Cancelada', 'Reprovada', 'Saída'].includes(status)) return '#c7473f';
      return '#f9732f';
    }

    function escapeHtml(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
    }

    function audit(action, detail) {
      db.audit ||= [];
      db.audit.unshift({
        id: uid('aud'),
        date: new Date().toLocaleString('pt-BR'),
        user: 'Administrador',
        action,
        detail
      });
      db.audit = db.audit.slice(0, 80);
    }

    function applyBranding() {
      const company = db.company || seed.company;
      document.title = company.systemName || 'Troca Âe SIS PRO';
      document.documentElement.style.setProperty('--green', company.primaryColor || '#f9732f');
      document.documentElement.style.setProperty('--brand-primary', company.primaryColor || '#f9732f');
      document.documentElement.style.setProperty('--brand-dark', company.darkColor || '#18231f');
      document.body.classList.toggle('dark-mode', company.theme === 'dark');
      const brandName = document.getElementById('brandName');
      const logo = document.getElementById('brandLogo');
      const mark = document.getElementById('brandMark');
      if (brandName) brandName.textContent = company.systemName || 'Troca Âe SIS PRO';
      if (logo && mark) {
        if (company.logo) {
          logo.src = company.logo;
          logo.style.display = 'block';
          mark.style.display = 'none';
        } else {
          logo.removeAttribute('src');
          logo.style.display = 'none';
          mark.style.display = 'grid';
        }
      }
    }

    function readLogoFile(input) {
      const file = input.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        db.company.logo = reader.result;
        audit('Logo alterada', file.name);
        save();
      };
      reader.readAsDataURL(file);
    }

    function updateSidebarPin() {
      document.body.classList.toggle('sidebar-fixed', sidebarFixed);
      const btn = document.getElementById('sidebarPinBtn');
      if (btn) {
        btn.textContent = sidebarFixed ? '✓' : '⇔';
        btn.title = sidebarFixed ? 'Menu fixo ativado' : 'Fixar menu';
      }
    }

    function toggleSidebarFixed() {
      sidebarFixed = !sidebarFixed;
      localStorage.setItem('troca-ae-sidebar-fixed', sidebarFixed ? '1' : '0');
      updateSidebarPin();
    }

    function initNav() {
      document.getElementById('nav').innerHTML = routes.map(([id, ico, label]) =>
        `<button class="nav-btn ${id === current ? 'active' : ''}" data-route="${id}"><span class="nav-ico">${ico}</span><span class="nav-label">${label}</span></button>`
      ).join('');
      document.querySelectorAll('.nav-btn').forEach(btn => btn.onclick = () => go(btn.dataset.route));
      updateSidebarPin();
    }

    function go(route) {
      current = route;
      const meta = routes.find(r => r[0] === route);
      document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === route));
      document.getElementById('pageTitle').textContent = meta[3];
      document.getElementById('pageSub').textContent = meta[4];
      initNav();
      render();
    }

    function render() {
      initNav();
      renderDashboard();
      renderOrders();
      renderClients();
      renderManufacturers();
      renderParts();
      renderServices();
      renderFinance();
      renderReports();
      renderSettings();
    }

    function renderDashboard() {
      const openOrders = db.orders.filter(o => o.status !== 'Finalizada' && o.status !== 'Cancelada');
      const receivables = db.orders.reduce((sum, o) => sum + Math.max(0, calcOrder(o).balance), 0);
      const income = db.finance.filter(f => f.type === 'Entrada').reduce((s, f) => s + Number(f.amount), 0);
      const expense = db.finance.filter(f => f.type === 'Saída').reduce((s, f) => s + Number(f.amount), 0);
      const lowParts = db.parts.filter(p => Number(p.stock) <= Number(p.min));
      const statusCounts = db.orders.reduce((acc, order) => (acc[order.status] = (acc[order.status] || 0) + 1, acc), {});
      const maxStatus = Math.max(1, ...Object.values(statusCounts));
      const topStatuses = Object.entries(statusCounts).sort((a, b) => b[1] - a[1]);
      const stockSummary = [
        ['Estoque baixo', lowParts.length],
        ['Sem estoque', db.parts.filter(p => Number(p.stock) === 0).length],
        ['Total de peças', db.parts.length]
      ];
      document.getElementById('dashboard').innerHTML = `
        <div class="grid kpis">
          ${kpi('OS abertas', openOrders.length, 'Serviços em andamento')}
          ${kpi('A receber', money.format(receivables), 'Saldos de OS não quitadas')}
          ${kpi('Saldo financeiro', money.format(income - expense), 'Entradas menos saídas')}
          ${kpi('Estoque baixo', lowParts.length, 'Peças abaixo do mínimo')}
        </div>
        <div class="dash-grid">
          <div class="panel">
            <div class="panel-head"><h2>Operação por status</h2><button class="btn primary" onclick="go('orders')">Ver OS</button></div>
            <div class="panel-body chart-list">
              ${topStatuses.map(([name, count]) => `<div class="mini-chart-row"><strong>${escapeHtml(name)}</strong><div class="mini-track"><div class="mini-fill" style="width:${count / maxStatus * 100}%;background:${statusColor(name)}"></div></div><span>${count} OS</span></div>`).join('')}
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>Resumo financeiro</h2></div>
            <div class="panel-body">
              <div class="summary-list">
                <div class="summary-item"><strong>Entradas</strong><span class="money">${money.format(income)}</span></div>
                <div class="summary-item"><strong>Saídas</strong><span class="money">${money.format(expense)}</span></div>
                <div class="summary-item"><strong>Resultado</strong><span class="money">${money.format(income - expense)}</span></div>
              </div>
            </div>
          </div>
        </div>
        <div class="grid two" style="margin-top:14px">
          <div class="panel">
            <div class="panel-head"><h2>Estoque em resumo</h2><button class="btn" onclick="go('parts')">Ver peças</button></div>
            <div class="panel-body chart-list">
              ${stockSummary.map(([name, count]) => `<div class="mini-chart-row"><strong>${name}</strong><div class="mini-track"><div class="mini-fill" style="width:${Math.min(100, count / Math.max(1, db.parts.length) * 100)}%"></div></div><span>${count}</span></div>`).join('')}
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>Alertas operacionais</h2></div>
            <div class="panel-body summary-list">
              ${openOrders.filter(o => new Date(o.due) < new Date(today())).slice(0, 3).map(o => `<div class="summary-item"><strong>OS ${o.number} atrasada</strong><span>${escapeHtml(clientName(o.clientId))}</span></div>`).join('') || '<div class="summary-item"><strong>Sem OS atrasada</strong><span>Hoje</span></div>'}
              ${lowParts.slice(0, 3).map(p => `<div class="summary-item"><strong>${escapeHtml(p.name)}</strong><span>${p.stock}/${p.min}</span></div>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function kpi(label, value, hint) {
      return `<div class="kpi"><span>${label}</span><strong>${value}</strong><small>${hint}</small></div>`;
    }

    function renderOrders() {
      const rows = filteredOrders();
      if (!rows.some(order => order.id === selectedOrderId)) selectedOrderId = rows[0]?.id || db.orders[0]?.id || '';
      document.getElementById('orders').innerHTML = `
        <div class="panel">
          <div class="panel-head"><h2>Painel operacional de OS</h2><button class="btn primary" onclick="openOrderModal()">+ Nova OS</button></div>
          <div class="panel-body">
            <div class="filters">
              <input id="orderSearch" placeholder="Buscar por cliente, aparelho, OS ou técnico" oninput="resetPage('orders'); filterOrders()">
              <select id="orderStatus" onchange="resetPage('orders'); filterOrders()"><option value="">Todos os status</option>${osStatuses.map(s => `<option>${s}</option>`).join('')}</select>
              <select id="orderPriority" onchange="resetPage('orders'); filterOrders()"><option value="">Todas prioridades</option><option>Normal</option><option>Alta</option><option>Urgente</option></select>
            </div>
            <div class="ops-layout">
              <div id="ordersList">${orderCards(rows)}</div>
              <div id="orderDetail">${orderDetail(selectedOrderId)}</div>
            </div>
          </div>
        </div>`;
    }

    function filteredOrders() {
      const q = document.getElementById('orderSearch')?.value.toLowerCase() || '';
      const status = document.getElementById('orderStatus')?.value || '';
      const priority = document.getElementById('orderPriority')?.value || '';
      return db.orders.filter(o => {
        const hay = `${o.number} ${clientName(o.clientId)} ${deviceName(o)} ${o.deviceImei || ''} ${o.technician} ${o.defect}`.toLowerCase();
        return (!q || hay.includes(q)) && (!status || o.status === status) && (!priority || o.priority === priority);
      }).sort((a, b) => Number(b.number) - Number(a.number));
    }

    function orderCards(rows) {
      if (!rows.length) return '<div class="empty">Nenhuma ordem encontrada.</div>';
      const visibleRows = paginate('orders', rows);
      return `<div class="os-list">${visibleRows.map(order => {
        const calc = calcOrder(order);
        return `<button class="os-card ${order.id === selectedOrderId ? 'active' : ''}" onclick="selectOrder('${order.id}')">
          <div class="status-strip" style="background:${statusColor(order.status)}"></div>
          <div class="os-card-top"><strong>#${order.number} - ${escapeHtml(clientName(order.clientId))}</strong>${badge(order.status)}</div>
          <div class="os-meta">
            <span>${escapeHtml(deviceName(order))}</span>
            <span>${escapeHtml(order.defect || 'Sem defeito informado')}</span>
            <span>${order.opened} até ${order.due} | ${escapeHtml(order.priority)}</span>
            <span class="money">${money.format(calc.total)} | saldo ${money.format(calc.balance)}</span>
          </div>
        </button>`;
      }).join('')}</div>${pager('orders', rows.length, 'filterOrders')}`;
    }

    function orderDetail(id) {
      const order = db.orders.find(o => o.id === id);
      if (!order) return '<div class="panel"><div class="panel-body empty">Selecione uma OS.</div></div>';
      const calc = calcOrder(order);
      const parts = order.parts.map(item => {
        const part = db.parts.find(p => p.id === item.id);
        return part ? `${part.name} (${item.qty || 1})` : '';
      }).filter(Boolean).join(', ') || 'Nenhuma peça selecionada';
      const services = order.services.map(id => db.services.find(s => s.id === id)?.name).filter(Boolean).join(', ') || 'Nenhum serviço selecionado';
      return `<div class="panel">
        <div class="panel-head">
          <h2>OS #${order.number}</h2>
          ${badge(order.status)}
        </div>
        <div class="panel-body">
          <div class="detail-top">
            <div>
              <h2 style="margin:0 0 4px">${escapeHtml(clientName(order.clientId))}</h2>
              <div class="muted">${escapeHtml(deviceName(order))} | IMEI ${escapeHtml(order.deviceImei || 'não informado')}</div>
            </div>
            <div class="money">${money.format(calc.total)}</div>
          </div>
          <div class="detail-actions">
            <button class="btn primary" onclick="openOrderModal('${order.id}')">Editar</button>
            <button class="btn" onclick="payOrder('${order.id}')">Pagamento</button>
            <button class="btn" onclick="finishOrder('${order.id}')">Finalizar</button>
            <button class="btn" onclick="printOrder('${order.id}')">Imprimir OS</button>
          </div>
          <div class="detail-grid">
            <div class="detail-item"><span>Status</span>${badge(order.status)}<br><small class="muted">${escapeHtml(order.priority)}</small></div>
            <div class="detail-item"><span>Prazo</span>${order.opened} até ${order.due}</div>
            <div class="detail-item"><span>Defeito</span>${escapeHtml(order.defect || '')}</div>
            <div class="detail-item"><span>Diagnóstico</span>${escapeHtml(order.diagnosis || '')}</div>
            <div class="detail-item"><span>Peças</span>${escapeHtml(parts)}</div>
            <div class="detail-item"><span>Serviços</span>${escapeHtml(services)}</div>
            <div class="detail-item"><span>Pagamento</span>Pago ${money.format(order.paid || 0)}<br><small class="muted">Saldo ${money.format(calc.balance)}</small></div>
            <div class="detail-item"><span>Pós-venda</span>${escapeHtml(order.followUp || 'Não informado')}</div>
            <div class="detail-item"><span>Fotos</span>${(order.photoFiles || []).length} arquivo(s)<br><button class="btn" type="button" onclick="downloadOrderPhotosFromSaved('${order.id}')">Baixar fotos</button></div>
          </div>
        </div>
      </div>`;
    }

    function selectOrder(id) {
      selectedOrderId = id;
      document.getElementById('ordersList').innerHTML = orderCards(filteredOrders());
      document.getElementById('orderDetail').innerHTML = orderDetail(id);
    }

    function ordersTable(rows) {
      if (!rows.length) return '<div class="empty">Nenhuma ordem encontrada.</div>';
      return `<table><thead><tr><th>OS</th><th>Cliente</th><th>Aparelho</th><th>Status</th><th>Total</th><th>Ações</th></tr></thead><tbody>
        ${rows.map(o => {
          const c = calcOrder(o);
          return `<tr>
            <td><strong>#${o.number}</strong><br><span class="muted">${o.opened} até ${o.due}</span></td>
            <td>${escapeHtml(clientName(o.clientId))}<br><span class="muted">${escapeHtml(o.technician)}</span></td>
            <td>${escapeHtml(deviceName(o))}<br><span class="muted">${escapeHtml(o.defect)}</span></td>
            <td>${badge(o.status)}<br><span class="muted">${o.priority}</span></td>
            <td><span class="money">${money.format(c.total)}</span><br><span class="muted">Saldo ${money.format(c.balance)}</span></td>
            <td><div class="actions">
              <button class="icon-btn" title="Editar" onclick="openOrderModal('${o.id}')">✎</button>
              <button class="icon-btn" title="Pagamento" onclick="payOrder('${o.id}')">$</button>
              <button class="icon-btn" title="Finalizar" onclick="finishOrder('${o.id}')">✓</button>
              <button class="icon-btn" title="Imprimir OS" onclick="printOrder('${o.id}')">P</button>
            </div></td>
          </tr>`;
        }).join('')}</tbody></table>`;
    }

    function filterOrders() {
      const rows = filteredOrders();
      if (!rows.some(order => order.id === selectedOrderId)) selectedOrderId = rows[0]?.id || '';
      document.getElementById('ordersList').innerHTML = orderCards(rows);
      document.getElementById('orderDetail').innerHTML = orderDetail(selectedOrderId);
    }

    function simpleCrud(section, title, fields, rows, columns, createItem) {
      document.getElementById(section).innerHTML = `
        <div class="panel">
          <div class="panel-head"><h2>${title}</h2><button class="btn primary" onclick="openSimpleModal('${section}')">+ Cadastrar</button></div>
          <div class="panel-body">
            <div class="filters"><input id="${section}Search" placeholder="Buscar" oninput="render()"><span></span><span></span></div>
            ${table(section, fields, rows, columns)}
          </div>
        </div>`;
      window[`openSimpleModal_${section}`] = () => openSimpleModal(section);
    }

    function table(section, fields, rows, columns, actionSection = section) {
      const search = document.getElementById(`${section}Search`)?.value.toLowerCase() || '';
      const list = rows.filter(row => Object.values(row).join(' ').toLowerCase().includes(search));
      if (!list.length) return '<div class="empty">Nenhum registro encontrado.</div>';
      const pagedSections = ['manufacturersFiltered', 'productModelsFiltered', 'partsFiltered', 'suppliersFiltered', 'manufacturers', 'productModels', 'parts', 'suppliers'];
      const shouldPage = pagedSections.includes(section);
      const visibleRows = shouldPage ? paginate(section, list) : list;
      return `<table><thead><tr>${columns.map(c => `<th>${c.label}</th>`).join('')}<th>Ações</th></tr></thead><tbody>
        ${visibleRows.map(row => `<tr>${columns.map(c => `<td>${c.render ? c.render(row) : escapeHtml(row[c.key])}</td>`).join('')}
        <td><div class="actions"><button class="icon-btn" title="Editar" onclick="openSimpleModal('${actionSection}','${row.id}')">✎</button><button class="icon-btn" title="Excluir" onclick="removeItem('${actionSection}','${row.id}')">×</button></div></td></tr>`).join('')}
      </tbody></table>${shouldPage ? pager(section, list.length, section.includes('productModels') || section.includes('manufacturers') ? 'filterManufacturers' : 'filterParts') : ''}`;
    }

    function manufacturerTables(manufacturerRows, modelRows) {
      return {
        manufacturers: table('manufacturersFiltered', {}, manufacturerRows, [
          { label: 'Fabricante', key: 'name', render: r => `<strong>${escapeHtml(r.name)}</strong><br><span class="muted">${escapeHtml(r.site)}</span>` },
          { label: 'Suporte', key: 'supportPhone' },
          { label: 'Modelos', key: 'id', render: r => `${db.productModels.filter(m => m.manufacturerId === r.id).length} cadastrados` },
          { label: 'Observações', key: 'notes' }
        ], 'manufacturers'),
        models: table('productModelsFiltered', {}, modelRows, [
          { label: 'Modelo', key: 'name', render: r => `<strong>${escapeHtml(r.name)}</strong><br><span class="muted">${escapeHtml(r.category)}</span>` },
          { label: 'Fabricante', key: 'manufacturerId', render: r => escapeHtml(manufacturerName(r.manufacturerId)) },
          { label: 'Ano', key: 'year' },
          { label: 'Observações', key: 'notes' }
        ], 'productModels')
      };
    }

    function partTables(partRows, supplierRows, movementRows) {
      return {
        parts: table('partsFiltered', {}, partRows, [
          { label: 'Peça', key: 'name', render: r => `<strong>${escapeHtml(r.name)}</strong><br><span class="muted">${escapeHtml(r.sku)}</span>` },
          { label: 'Fabricante', key: 'manufacturerId', render: r => `${escapeHtml(manufacturerName(r.manufacturerId))}<br><span class="muted">${(r.compatibleModels || []).map(modelName).join(', ') || 'Sem modelos vinculados'}</span>` },
          { label: 'Estoque', key: 'stock', render: r => `${Number(r.stock) <= Number(r.min) ? badge('Pendente') : badge('Recebido')}<br><span class="muted">${r.stock} un. / mín. ${r.min}</span>` },
          { label: 'Preço', key: 'price', render: r => `<span class="money">${money.format(r.price)}</span><br><span class="muted">Custo médio ${money.format(r.cost)}</span>` }
        ], 'parts'),
        suppliers: table('suppliersFiltered', {}, supplierRows, [
          { label: 'Fornecedor', key: 'name', render: r => `<strong>${escapeHtml(r.name)}</strong><br><span class="muted">${escapeHtml(r.document)}</span>` },
          { label: 'Contato', key: 'phone', render: r => `${escapeHtml(r.phone)}<br><span class="muted">${escapeHtml(r.email)}</span>` },
          { label: 'Observações', key: 'notes' }
        ], 'suppliers'),
        movements: `<table><thead><tr><th>Data</th><th>Peça</th><th>Tipo</th><th>Qtd.</th><th>Custo</th><th>Motivo</th></tr></thead><tbody>
          ${movementRows.map(m => `<tr><td>${m.date}</td><td>${escapeHtml(partName(m.partId))}</td><td>${badge(m.type)}</td><td>${m.qty}</td><td>${money.format(m.unitCost || 0)}</td><td>${escapeHtml(m.reason)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Nenhuma movimentação encontrada.</td></tr>'}
        </tbody></table>`
      };
    }

    function financeTable(rows) {
      if (!rows.length) return '<div class="empty">Nenhum lançamento encontrado.</div>';
      return `<table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Status</th><th>Pagamento</th><th>Valor</th><th>Ações</th></tr></thead><tbody>
        ${rows.map(f => `<tr><td>${f.date}<br><span class="muted">Venc. ${f.dueDate}</span></td><td>${badge(f.type)}</td><td><strong>${escapeHtml(f.description)}</strong><br><span class="muted">${escapeHtml(f.category)}</span></td><td>${badge(f.status)}</td><td>${escapeHtml(f.paymentMethod || '')}</td><td><span class="money">${money.format(f.amount)}</span></td><td><button class="icon-btn" onclick="markFinancePaid('${f.id}')" title="Marcar pago">✓</button><button class="icon-btn" onclick="removeFinance('${f.id}')" title="Excluir">×</button></td></tr>`).join('')}
      </tbody></table>`;
    }

    function renderClients() {

    function filterManufacturers() {
      const manufacturerQ = (document.getElementById('manufacturerSearch')?.value || '').toLowerCase();
      const modelQ = (document.getElementById('modelSearch')?.value || '').toLowerCase();
      const manufacturerId = document.getElementById('modelManufacturerFilter')?.value || '';
      const year = document.getElementById('modelYearFilter')?.value || '';
      const manufacturerRows = db.manufacturers.filter(m => `${m.name} ${m.site} ${m.supportPhone} ${m.notes}`.toLowerCase().includes(manufacturerQ));
      const modelRows = db.productModels.filter(m => {
        const hay = `${m.name} ${m.category} ${m.year} ${m.notes} ${manufacturerName(m.manufacturerId)}`.toLowerCase();
        return (!modelQ || hay.includes(modelQ)) && (!manufacturerId || m.manufacturerId === manufacturerId) && (!year || String(m.year) === year);
      });
      const tables = manufacturerTables(manufacturerRows, modelRows);
      document.getElementById('manufacturersTable').innerHTML = tables.manufacturers;
      document.getElementById('modelsTable').innerHTML = tables.models;
    }

    function filterParts() {
      const partQ = (document.getElementById('partSearch')?.value || '').toLowerCase();
      const manufacturerId = document.getElementById('partManufacturerFilter')?.value || '';
      const stockFilter = document.getElementById('partStockFilter')?.value || '';
      const supplierQ = (document.getElementById('supplierSearch')?.value || '').toLowerCase();
      const movementQ = (document.getElementById('movementSearch')?.value || '').toLowerCase();
      const movementType = document.getElementById('movementTypeFilter')?.value || '';
      const partRows = db.parts.filter(part => {
        const models = (part.compatibleModels || []).map(modelName).join(' ');
        const hay = `${part.name} ${part.sku} ${part.category} ${part.supplier} ${manufacturerName(part.manufacturerId)} ${models}`.toLowerCase();
        const stockOk = !stockFilter || (stockFilter === 'low' && Number(part.stock) <= Number(part.min)) || (stockFilter === 'zero' && Number(part.stock) === 0);
        return (!partQ || hay.includes(partQ)) && (!manufacturerId || part.manufacturerId === manufacturerId) && stockOk;
      });
      const supplierRows = db.suppliers.filter(s => `${s.name} ${s.document} ${s.phone} ${s.email} ${s.notes}`.toLowerCase().includes(supplierQ));
      const movementRows = (db.stockMovements || []).filter(m => {
        const hay = `${partName(m.partId)} ${m.type} ${m.reason} ${supplierName(m.supplierId)} ${m.date}`.toLowerCase();
        return (!movementQ || hay.includes(movementQ)) && (!movementType || m.type === movementType);
      });
      const tables = partTables(partRows, supplierRows, movementRows);
      document.getElementById('partsTable').innerHTML = tables.parts;
      document.getElementById('suppliersTable').innerHTML = tables.suppliers;
      document.getElementById('movementsTable').innerHTML = tables.movements;
    }

    function filterFinance() {
      const q = (document.getElementById('financeSearch')?.value || '').toLowerCase();
      const type = document.getElementById('financeTypeFilter')?.value || '';
      const status = document.getElementById('financeStatusFilter')?.value || '';
      const method = document.getElementById('financeMethodFilter')?.value || '';
      const date = document.getElementById('financeDateFilter')?.value || '';
      const rows = db.finance.filter(f => {
        const order = f.orderId ? db.orders.find(o => o.id === f.orderId) : null;
        const hay = `${f.description} ${f.category} ${f.amount} ${f.type} ${f.status} ${f.paymentMethod} ${order ? order.number : ''} ${order ? clientName(order.clientId) : ''}`.toLowerCase();
        return (!q || hay.includes(q)) && (!type || f.type === type) && (!status || f.status === status) && (!method || f.paymentMethod === method) && (!date || f.date === date || f.dueDate === date);
      });
      document.getElementById('financeTable').innerHTML = financeTable(rows);
    }

    function rowInReportPeriod(date) {
      if (!date) return true;
      return (!reportFilters.start || date >= reportFilters.start) && (!reportFilters.end || date <= reportFilters.end);
    }

    function setReportPeriod() {
      syncReportPeriodFromInputs();
      renderReports();
    }

    function syncReportPeriodFromInputs() {
      const startInput = document.getElementById('reportStart');
      const endInput = document.getElementById('reportEnd');
      if (startInput) reportFilters.start = startInput.value || '';
      if (endInput) reportFilters.end = endInput.value || '';
    }

    function clearReportPeriod() {
      reportFilters.start = '';
      reportFilters.end = '';
      renderReports();
    }

    function reportPeriodLabel() {
      if (reportFilters.start && reportFilters.end) return `Período: ${reportFilters.start} até ${reportFilters.end}`;
      if (reportFilters.start) return `A partir de ${reportFilters.start}`;
      if (reportFilters.end) return `Até ${reportFilters.end}`;
      return 'Sem filtro de data';
    }

    function renderReports() {
      const reportOrders = db.orders.filter(o => rowInReportPeriod(o.opened));
      const reportFinance = db.finance.filter(f => rowInReportPeriod(f.date || f.dueDate));
      const statusCounts = reportOrders.reduce((acc, o) => (acc[o.status] = (acc[o.status] || 0) + 1, acc), {});
      const max = Math.max(1, ...Object.values(statusCounts));
      const revenueByService = db.services.map(s => ({
        name: s.name,
        total: reportOrders.filter(o => o.services.includes(s.id)).reduce((sum, o) => sum + Number(s.labor), 0)
      })).sort((a, b) => b.total - a.total);
      const income = reportFinance.filter(f => f.type === 'Entrada').reduce((s, f) => s + Number(f.amount), 0);
      const expense = reportFinance.filter(f => f.type === 'Saída').reduce((s, f) => s + Number(f.amount), 0);
      const orderProfit = reportOrders.map(order => {
        const calc = calcOrder(order);
        const cost = order.parts.reduce((sum, item) => {
          const part = db.parts.find(p => p.id === item.id);
          return sum + (part ? Number(part.cost || 0) * Number(item.qty || 1) : 0);
        }, 0);
        return { order, gross: calc.total - cost };
      });
      const lowParts = db.parts.filter(p => Number(p.stock) <= Number(p.min));
      document.getElementById('reports').innerHTML = `
        <div class="panel" style="margin-bottom:14px">
          <div class="panel-head"><h2>Relatórios e exportação</h2><span class="muted">${reportPeriodLabel()}</span></div>
          <div class="panel-body">
            <div class="report-period">
              <div class="field"><label>Data inicial</label><input id="reportStart" type="date" value="${reportFilters.start}"></div>
              <div class="field"><label>Data final</label><input id="reportEnd" type="date" value="${reportFilters.end}"></div>
              <div class="field"><label>&nbsp;</label><button class="btn primary" onclick="setReportPeriod()">Aplicar período</button></div>
              <div class="field"><label>&nbsp;</label><button class="btn" onclick="clearReportPeriod()">Limpar filtro</button></div>
            </div>
            <div class="export-grid">
              <button class="btn" onclick="exportReport('clients')">Clientes</button>
              <button class="btn" onclick="exportReport('orders')">Ordens de Serviço</button>
              <button class="btn" onclick="exportReport('parts')">Peças</button>
              <button class="btn" onclick="exportReport('finance')">Financeiro</button>
              <button class="btn" onclick="exportReport('manufacturers')">Fabricantes</button>
              <button class="btn" onclick="exportReport('models')">Modelos</button>
              <button class="btn" onclick="exportReport('services')">Serviços</button>
              <button class="btn" onclick="exportReport('stock')">Mov. Estoque</button>
            </div>
          </div>
        </div>
        <div class="grid two">
          <div class="panel">
            <div class="panel-head"><h2>Status das ordens</h2></div>
            <div class="panel-body bars">
              ${Object.entries(statusCounts).map(([name, count]) => `<div class="bar-row"><strong>${name}</strong><div class="bar-track"><div class="bar-fill" style="width:${count / max * 100}%"></div></div><span>${count} OS</span></div>`).join('')}
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>Receita por serviço</h2></div>
            <div class="panel-body bars">
              ${revenueByService.map(row => `<div class="bar-row"><strong>${escapeHtml(row.name)}</strong><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100, row.total / 500 * 100)}%"></div></div><span>${money.format(row.total)}</span></div>`).join('')}
            </div>
          </div>
        </div>
        <div class="panel" style="margin-top:14px">
          <div class="panel-head"><h2>Resultado e estoque</h2></div>
          <div class="panel-body">
            <div class="grid kpis">
              ${kpi('Fluxo de caixa', money.format(income - expense), 'Entradas menos saídas')}
              ${kpi('Resultado mensal', money.format(income - expense), 'DRE simples do período')}
              ${kpi('Lucro bruto em OS', money.format(orderProfit.reduce((s, r) => s + r.gross, 0)), 'Receita de OS menos custo das peças')}
              ${kpi('Alertas de estoque', lowParts.length, 'Itens no estoque mínimo')}
            </div>
            <table><thead><tr><th>OS</th><th>Cliente</th><th>Total</th><th>Lucro bruto</th></tr></thead><tbody>
              ${orderProfit.map(row => `<tr><td>#${row.order.number}</td><td>${escapeHtml(clientName(row.order.clientId))}</td><td>${money.format(calcOrder(row.order).total)}</td><td>${money.format(row.gross)}</td></tr>`).join('')}
            </tbody></table>
          </div>
        </div>`;
    }

      return `<table><thead><tr><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody>
        ${db.users.map(user => `<tr class="${user.id === selectedUserId ? 'selected-row' : ''}" onclick="selectUserForPermissions('${user.id}')">

      </tbody></table>`;

    function selectUserForPermissions(userId) {
      selectedUserId = userId;
      renderSettings();

    function permissionMatrixForUser(user) {
      const role = db.roles.find(r => r.id === user.roleId);
      if (!role) return '<div class="empty">Perfil do usuário não encontrado.</div>';
      return `<div style="margin-bottom:12px">
        <strong>${escapeHtml(user.name)}</strong><br>
        <span class="muted">${escapeHtml(user.email)} · ${escapeHtml(role.name)} · nível ${role.level}</span>
      </div>${permissionMatrix(role)}`;
    }

    function permissionModules() {
      return [
        ['clientes', 'Clientes', ['ver','criar','editar','excluir']],
        ['os', 'Ordens de serviço', ['ver','criar','editar','aprovar','finalizar','imprimir','excluir']],
        ['estoque', 'Peças e estoque', ['ver','criar','editar','movimentar','excluir']],
        ['financeiro', 'Financeiro', ['ver','criar','editar','pagar','excluir']],
        ['relatorios', 'Relatórios', ['ver','exportar']],
        ['fabricantes', 'Fabricantes e modelos', ['ver','criar','editar','excluir']],
        ['configuracoes', 'Configurações', ['ver','editar']],
        ['auditoria', 'Auditoria', ['ver','excluir']]
      ];
    }

    function permissionLabel(action) {
      return { ver: 'Ver', criar: 'Criar', editar: 'Editar', excluir: 'Excluir', aprovar: 'Aprovar', finalizar: 'Finalizar', imprimir: 'Imprimir', movimentar: 'Movimentar', pagar: 'Pagar', exportar: 'Exportar' }[action] || action;
    }

    function roleHasPermission(role, moduleKey, action) {
      role.permissionMatrix ||= {};
      if (role.permissionMatrix[moduleKey]?.includes(action)) return true;
      if (!Object.keys(role.permissionMatrix).length && (role.permissions || []).includes(moduleKey)) return ['ver','criar','editar'].includes(action);
      return false;
    }

    function permissionMatrix(selectedRole = null) {
      const modules = permissionModules();
      const roles = selectedRole ? [selectedRole] : db.roles;
      return `<div class="permission-grid">${roles.map(role => `
        <div style="margin-bottom:18px">

          <table><thead><tr><th>Módulo</th>${['ver','criar','editar','aprovar','finalizar','imprimir','movimentar','pagar','exportar','excluir'].map(action => `<th>${permissionLabel(action)}</th>`).join('')}</tr></thead><tbody>

    function togglePermission(roleId, moduleKey, action, enabled) {
      const role = db.roles.find(r => r.id === roleId);
      if (!role) return;
      role.permissionMatrix ||= {};
      role.permissionMatrix[moduleKey] ||= [];
      if (enabled && !role.permissionMatrix[moduleKey].includes(action)) role.permissionMatrix[moduleKey].push(action);
      if (!enabled) role.permissionMatrix[moduleKey] = role.permissionMatrix[moduleKey].filter(item => item !== action);
      audit('Permissão alterada', `${role.name}: ${moduleKey}.${action} ${enabled ? 'ativada' : 'removida'}`);
      save();
    }

    function formHtml(fields, item) {
      return `<div class="form-grid">${fields.map(([key, label, type]) => {
        const value = escapeHtml(item[key] ?? '');
        if (type === 'textarea') return `<div class="field wide"><label>${label}</label><textarea name="${key}">${value}</textarea></div>`;
        if (type === 'client') return `<div class="field"><label>${label}</label><select name="${key}">${db.clients.map(c => `<option value="${c.id}" ${item[key] === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>`;

        if (type === 'model') return `<div class="field"><label>${label}</label><select name="${key}"><option value="">Selecione</option>${db.productModels.map(m => `<option value="${m.id}" ${item[key] === m.id ? 'selected' : ''}>${escapeHtml(manufacturerName(m.manufacturerId))} - ${escapeHtml(m.name)}</option>`).join('')}</select></div>`;
        if (type === 'models') {

        }
        if (type === 'role') return `<div class="field"><label>${label}</label><select name="${key}">${db.roles.map(r => `<option value="${r.id}" ${item[key] === r.id ? 'selected' : ''}>${escapeHtml(r.name)} - nível ${r.level}</option>`).join('')}</select></div>`;
        if (type === 'status') return `<div class="field"><label>${label}</label><select name="${key}">${['Ativo','Inativo'].map(s => `<option ${item[key] === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>`;
        if (type === 'zip') return `<div class="field"><label>${label}</label><input name="${key}" inputmode="numeric" value="${value}" onblur="lookupCep(this.value)"></div>`;
        return `<div class="field"><label>${label}</label><input name="${key}" type="${type || 'text'}" value="${value}"></div>`;
      }).join('')}</div>`;

    function readForm(fields) {
      const form = new FormData(document.getElementById('modalForm'));
      const data = {};
      fields.forEach(([key,, type]) => {
        if (type === 'number') data[key] = Number(form.get(key) || 0);
        else if (type === 'models') data[key] = form.getAll(key);
        else data[key] = form.get(key);
      });
      return data;
    }

    async function lookupCep(value) {
      const cep = String(value || '').replace(/\D/g, '');
      if (cep.length !== 8) return;
      const zipInput = document.querySelector('[name="zip"]');
      zipInput.value = cep.replace(/(\d{5})(\d{3})/, '$1-$2');
      try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const data = await response.json();
        if (data.erro) {
          alert('CEP não encontrado.');
          return;
        }
        document.querySelector('[name="street"]').value = data.logradouro || '';
        document.querySelector('[name="neighborhood"]').value = data.bairro || '';
        document.querySelector('[name="city"]').value = data.localidade || '';
        document.querySelector('[name="state"]').value = data.uf || '';
        const complement = document.querySelector('[name="complement"]');
        if (complement && data.complemento && !complement.value) complement.value = data.complemento;
        document.querySelector('[name="number"]')?.focus();
      } catch (error) {
        alert('Não foi possível consultar o CEP agora. Preencha o endereço manualmente.');
      }
    }

    function orderModelOptions(manufacturerId, selectedModelId = '') {
      const models = db.productModels.filter(model => !manufacturerId || model.manufacturerId === manufacturerId);
      return `<option value="">Selecione</option>${models.map(model => `<option value="${model.id}" ${selectedModelId === model.id ? 'selected' : ''}>${escapeHtml(manufacturerName(model.manufacturerId))} - ${escapeHtml(model.name)}</option>`).join('')}`;
    }

    function partsForOrder(manufacturerId, modelId) {
      if (modelId) {
        const selectedModel = db.productModels.find(model => model.id === modelId);
        const sameModelIds = db.productModels
          .filter(model => selectedModel && model.manufacturerId === selectedModel.manufacturerId && model.name === selectedModel.name)
          .map(model => model.id);
        return db.parts.filter(part => (part.compatibleModels || []).some(id => sameModelIds.includes(id)));
      }
      if (manufacturerId) return db.parts.filter(part => part.manufacturerId === manufacturerId);
      return db.parts.slice(0, 80);
    }

    function orderPartsChecks(rows, selected) {
      if (!rows.length) return '<div class="empty">Selecione fabricante e modelo para listar as peças compatíveis.</div>';
      return checks('parts', rows, selected, part => `${part.name} - ${manufacturerName(part.manufacturerId)} - ${money.format(part.price)}`);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadOrderPhotos(files) {
      const selected = Array.from(files || []).filter(file => file.type.startsWith('image/'));
      if (!selected.length) return;
      for (const file of selected) {
        const dataUrl = await readFileAsDataUrl(file);
        pendingOrderPhotos.push({
          id: uid('foto'),
          name: file.name,
          type: file.type,
          size: file.size,
          dataUrl,
          createdAt: new Date().toLocaleString('pt-BR')
        });
      }
      refreshOrderPhotoList();
      const input = document.getElementById('orderPhotoUpload');
      if (input) input.value = '';
    }

    function triggerDownload(dataUrl, name) {
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = name || `foto-os-${today()}.jpg`;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function downloadOrderPhoto(index) {
      const photo = pendingOrderPhotos[index];
      if (!photo) return;
      triggerDownload(photo.dataUrl, photo.name);
    }

    function downloadAllOrderPhotos() {
      if (!pendingOrderPhotos.length) {
        alert('Nenhuma foto cadastrada nesta OS.');
        return;
      }
      pendingOrderPhotos.forEach((photo, index) => {
        setTimeout(() => triggerDownload(photo.dataUrl, photo.name), index * 180);
      });
    }

    function removeOrderPhoto(index) {
      pendingOrderPhotos.splice(index, 1);
      refreshOrderPhotoList();
    }

    function downloadOrderPhotosFromSaved(orderId) {
      const order = db.orders.find(o => o.id === orderId);
      const photos = order?.photoFiles || [];
      if (!photos.length) {
        alert('Nenhuma foto cadastrada nesta OS.');
        return;
      }
      photos.forEach((photo, index) => setTimeout(() => triggerDownload(photo.dataUrl, photo.name), index * 180));
    }

    window.uploadOrderPhotos = uploadOrderPhotos;
    window.downloadOrderPhoto = downloadOrderPhoto;
    window.downloadAllOrderPhotos = downloadAllOrderPhotos;
    window.removeOrderPhoto = removeOrderPhoto;
    window.downloadOrderPhotosFromSaved = downloadOrderPhotosFromSaved;
